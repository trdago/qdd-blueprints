      resultado: pruebas ✅ · escenarios con prueba 23/23
      supuestos:
        - 'Paso 1 / EPF-C01: la cabecera de la tabla debe traer exactamente las etapas elegidas (Datos · Entreno · Puerta · Producción · Validación real), en ese orden; si no, el reporte no vale.'
        - 'Paso 2 / EPF-C03: «qué espera y de quién» se comprueba así: la nota nombra un rol de la lista (sin distinguir mayúsculas; «del CI» cuenta como «el CI») y además trae al menos otra palabra.'
        - 'Paso 3 / EPF-C06: «aprobado por <rol>» solo vale con un rol de la lista (base más los del proyecto), igual que el «de quién» de un ⏳; nunca con el nombre de alguien.'
        - 'Paso 3 / EPF-C04: la receta no dice cómo se ve un «uso real observado». Validación real en ✅ exige Producción en ✅ y una evidencia propia, es decir, que no sea solo la del despliegue (por ejemplo, una corrida).'
        - 'Paso 4 / EPT-M01: «la celda dice que espera la Puerta» se cumple si la nota de Producción nombra la etapa «Puerta» (sin distinguir mayúsculas), sea ⏳, ❌ o —.'
        - 'Paso 5 / EPF-C05, EPF-C08: las afirmaciones «<tarea> · <etapa>: <estado>» y los cierres «<tarea>: cerrada|descartada — <motivo>» solo se reconocen al comienzo de una línea del texto (puede ir tras una viñeta), con raya «—» y un motivo no vacío.'
        - 'Paso 5 / EPF-C07: la receta nombra las categorías pero no sus formatos. Teléfono = internacional con «+» o tres grupos de cifras separados; RUT = con dígito verificador tras guion, con puntos o sin ellos; clave privada = cabecera PEM «BEGIN … PRIVATE KEY»; token = prefijo conocido seguido de 6 caracteres o más. Los otros identificadores nacionales quedan como patrones que agrega el proyecto.'
        - 'Paso 6 / EPF-A01: la receta no fija el formato de estado.yaml. Se usa «etapas» (lista) y «tareas» (tarea → celdas con etapa, estado y nota), con cadenas entre comillas dobles.'
        - 'Paso 7 / EPT-C01, EPT-C02: las tareas abiertas son las filas de .qdd/project/estado.yaml (una tarea cerrada o descartada sale de la tabla). La actividad es un JSON en <carpeta central>/actividad/<hash del proyecto>.json, y se rechaza una carpeta central que quede dentro del proyecto.'
        - 'Paso 7 / EPT-C02: un pulso cuyo «quién» trae credenciales o datos personales (los patrones de EPF-C07) es un error y no se escribe nada.'
        - 'Paso 7 / EPT-C03: un pulso sin tarea late la última activada entre las que siguen en curso. Un pulso con tarea que la enciende, o una reactivación, la deja como la última activada.'
        - 'Paso 9 / EPT-C07, EPT-C08, EPT-C09: el panel muestra las N más nuevas y después las tareas en curso que falten, por orden de activación. El ● alterna según el segundo del reloj (par = brillante, impar = tenue), así todos los paneles van sincronizados. La primera lectura no destella. Los estilos son nombres abstractos (tenue, brillante, acento, atenuado), porque el dibujo de cada consola queda fuera del alcance.'
        - 'Paso 10 / EPT-C10, EPT-C12: dentro del tope de 5 s el pulso se descarta, sin envío diferido. El pulso lleva la hora en que corrió la herramienta, y uno que llega tarde nunca retrocede el último registrado. La herramienta de tareas (subagente) se reconoce por el nombre «task», sin distinguir mayúsculas.'
      aprobada: true
