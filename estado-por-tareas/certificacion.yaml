      supuestos:
        - 'Paso 2 (⏳): «qué y de quién» se lee como «espera <algo> de <rol>» (también «del CI»); el rol sale de la lista base más los que agregue el proyecto, así un nombre de persona nunca vale.'
        - 'Paso 2 (✅ evidencia): commit en hex de 7-40 con al menos un dígito (mayúsculas o minúsculas); semver X.Y.Z con prerelease/build opcional; «n/n pruebas» y «corrida <id>» tal como dice la receta.'
        - 'Paso 3 / EPF-C06: como todas las etapas requieren aprobación, todo ✅ debe llevar además «aprobado por <rol>» con un rol de la lista; si falta, la celda va «⏳ espera aprobación de <rol>».'
        - 'EPF-C04: el lector no puede saber si hubo uso real; una «Validación real» en ✅ debe nombrar el uso real observado («uso real …», no «sin uso real»); con solo la versión desplegada se rechaza.'
        - 'EPT-M01: si la Puerta no está en ✅ con evidencia, Producción no puede ir en ✅ y, si va en ⏳, su nota debe nombrar la Puerta; un ❌ de Producción solo nombra su falla.'
        - 'Paso 1: la «—» solo es estado al comienzo; dentro de la nota se acepta como guion. Una celda vacía o sin estado al inicio no vale.'
        - 'Paso 1: la tarea se identifica por su nombre en la primera columna (id = nombre); no puede llevar | ( ) , · : para no romper la tabla ni «(espera a X)».'
        - 'Paso 5: al crear una tarea sus celdas empiezan en «❌ sin empezar» (un ❌ nombrado) si no se dan.'
        - 'Paso 5: cambiar las dependencias de una tarea cuya última etapa ya está en ✅ hacia una que no terminó también se rechaza (EPT-D02).'
        - 'Paso 5 (lector): en un reporte una tarea puede esperar a otra que ya no está en la tabla (p. ej. descartada); solo se rechaza la que se espera a sí misma o un ciclo. La existencia la valida el modelo al escribir.'
        - 'Paso 6: las afirmaciones «<tarea> · <etapa>: <estado>» y los cierres «<tarea>: cerrada|descartada — <motivo>» ocupan su propia línea (con viñeta - * • opcional) fuera de la primera tabla.'
        - 'Paso 6 (secretos): teléfono = internacional con «+» y 8-15 dígitos, o móvil chileno 9XXXXXXXX; identificador nacional = RUT (con o sin puntos); xox se detecta como xox<letra>-…; el hallazgo dice tipo y línea sin repetir el valor.'
        - 'Paso 7: .qdd/project/estado.yaml se escribe como JSON (que es YAML 1.2 válido) para no usar dependencias; la entrega revisa el reporte y, si tiene hallazgos, no escribe nada.'
        - 'Paso 7: cada cierre se escribe en el reporte siguiente a cerrarse/descartarse y luego se marca reportado; el estado guarda los cerrados con su motivo.'
        - 'Paso 7 / objetivos=no: la tabla del reporte es la del ciclo «proyecto»; si hubiera tareas de un ciclo propio van en tablas aparte después de la primera (el lector revisa solo la primera).'
        - 'Paso 8: abreviaturas por defecto = 3 primeras letras alargadas hasta no repetirse (Dat Ent Pue Pro Val); un ciclo puede dar las suyas. Cuando hay ciclos propios el JSON trae también «proyecto».'
        - 'Paso 8: los ⏳ y ❌ de un objetivo se cuentan en su fila como «pendientes» [{tarea, etapa, estado}] con las etapas de su ciclo.'
        - 'Paso 8: la pregunta de un objetivo es «¿Cómo vamos con el objetivo «X»? Su criterio: … Avance, bloqueos y siguiente paso; actualiza las celdas de sus tareas con evidencia.».'
        - 'Paso 8: sin objetivo las tareas van después de los objetivos y sin conector; el panel muestra las 10 tareas más nuevas (más las en curso).'
        - 'Paso 9: la actividad vive en <QDD_HOME o ~/.local/share/qdd>/actividad/<hash del proyecto>.json; guarda solo un hash, no la ruta (puede llevar el nombre de la persona).'
        - 'Paso 9: activar o pulsar con «quién» que no parece una herramienta ([A-Za-z0-9_.:/-], ≤64) es error EPT-C02; una tarea apagada por la vida no se revive con un pulso sin tarea, sí con uno que la nombra.'
        - 'Paso 10: «comando» es una fuente conocida pero esta opción (solo-agente) la rechaza con EPT-C13; una fuente desconocida es EPT-C02.'
        - 'Paso 11: el latido es tiempo de lectura: el ● es tenue en segundos pares y brillante en impares; destella en «acento» 1 s desde la lectura en que cambia ultimo_pulso (la primera lectura no destella). El estilo va en datos (punto/running), el texto es apto para mensajería.'
        - 'Paso 12: el tope de 5 s es por panel (un Latidor por panel); el destello local ocurre con cada herramienta aunque la CLI no reciba pulso; la herramienta de tareas (Task/Agent, o «task» en OpenCode) late como subagente; el envío corre en un hilo y sus errores se ignoran.'
        - 'CLI: «python3 -m estado_tareas [--proyecto P] [--central C] check|activa|pulso|termina|panel» hace de ''qdd estado …''.'
      aprobada: true
