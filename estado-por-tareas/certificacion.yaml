      supuestos:
        - 'Paso 1 (tabla): el id de una tarea es el texto de su primera columna sin el sufijo «(espera a …)»; la receta dice que se depende «por su id» pero no distingue id de nombre.'
        - 'Paso 1 (tabla): un reporte sin tabla, una fila con más o menos celdas que etapas, una tarea repetida o etapas distintas a las del proyecto invalidan el reporte (las cuento como EPF-C01).'
        - 'Paso 1 (celda): se tolera el selector de variante U+FE0F tras el emoji; una celda vacía no tiene estado y no vale; las notas no llevan «|» ni saltos de línea.'
        - 'Paso 2 (evidencia): el commit acepta hexadecimal en mayúsculas o minúsculas y lleva límites de palabra; la versión semver no se valida más allá de X.Y.Z con prerelease/build opcionales (se aceptan ceros a la izquierda).'
        - 'Paso 2 (⏳): «de quién» se reconoce porque la nota nombra un rol de la lista (persona, QA, CI, producción + los del proyecto) como palabra; «qué espera» es que quede al menos una palabra que no sea el rol ni un artículo/preposición. No hay forma de detectar un nombre propio: se rechaza todo ⏳ sin rol.'
        - 'Paso 3 (aprobación): como «todas» requieren aprobación, todo ✅ (de cualquier etapa) debe decir «aprobado por <rol>» con un rol de la lista, además de su evidencia.'
        - 'Paso 3 / EPF-C04 (desplegado ≠ validado): un lector no puede saber si hubo uso real; supuse que Validación real ✅ no vale si toda su evidencia ya está en la celda de Producción o si su nota dice «desplegad…»; con una evidencia propia (p. ej. «corrida uso-42») sí.'
        - 'Paso 4 / EPT-M01: «la Puerta en ✅ con su evidencia» = estado ✅ con al menos una evidencia; si no, Producción ✅ no vale y una Producción en ⏳ o ❌ debe nombrar «Puerta» en su nota; Producción «—» se permite. Como todo ⏳ necesita un rol, la forma es «⏳ espera la Puerta de QA».'
        - 'Paso 5 (dependencias): las dependencias viven solo en estado.yaml; en el reporte solo se ven como «(espera a X, Y)», y el revisor del reporte marca EPT-D02 si esa fila tiene su última etapa que aplica en ✅.'
        - 'Paso 5 (EPT-D02): se revisa solo al pasar a terminada (última etapa que aplica a ✅ o cierre) o al cambiar las dependencias de una tarea ya terminada; si después una dependencia retrocede, la tarea que ya terminó no se invalida. Descartar una tarea no exige que sus dependencias hayan terminado.'
        - 'Paso 5: la «última etapa que aplica» es la última columna que no está en «—»; una dependencia repetida tampoco vale (EPT-D01).'
        - 'Paso 6 (cierres): el cierre se reconoce solo con la raya «—» (U+2014) y en su propia línea (con viñeta opcional); solo se exige cierre a las tareas que estaban en la tabla del reporte anterior.'
        - 'Paso 6 (afirmaciones): «<tarea> · <etapa>: <estado>» se reconoce al comienzo de una línea (con viñeta opcional) y solo se compara el estado, no la nota.'
        - 'Paso 6 (secretos): teléfono = «+» con 8+ dígitos, móvil chileno de 9 dígitos que empieza en 9, o grupos de 3–4 dígitos separados por espacio/guion que suman 8+ dígitos (para no confundir fechas ni versiones); RUT con o sin puntos, sin verificar el dígito; de «otro identificador nacional» solo implementé el RUT (el resto lo agrega el proyecto); los tokens con prefijo exigen 8+ caracteres tras el prefijo; «clave=», «token=», «password=» se marcan aunque el valor esté vacío. Los hallazgos se informan enmascarados.'
        - 'Paso 7 (archivo): estado.yaml guarda también las tareas cerradas o descartadas (con cierre y motivo), porque las dependencias necesitan saber si se cerraron; la tabla del reporte muestra solo las abiertas. El YAML es un subconjunto propio (listas en flujo de cadenas entre comillas dobles), escrito y leído sin bibliotecas externas.'
        - 'Paso 7 (formato mensajería): la tabla va como líneas con «|» dentro de un bloque ``` para que se vea monoespaciada en apps de mensajería; el lector acepta la tabla con o sin el bloque.'
        - 'Paso 7 (tarea nueva): al crear una tarea sus celdas empiezan en «⏳ espera empezar de la persona» (Producción en «⏳ espera la Puerta de QA»); la receta no dice el estado inicial.'
        - 'Paso 8 (actividad): vive en <carpeta central>/actividad/<sha256 de la ruta del proyecto>.json; la carpeta central la recibe el código (no adiviné la ruta real de QDD) y se rechaza si queda dentro del proyecto. No hay bloqueo entre procesos: escritura atómica por renombre y la última gana.'
        - 'Paso 8 (pulsos): un pulso sin tarea late la última activada entre las que siguen vivas; un pulso con tarea apagada la enciende y la deja como la última activada. Una tarea que dejó de estar abierta deja de estar en curso aunque nadie llame a Terminar. «quién» debe ser un nombre de herramienta (letras, dígitos, _ . : / -, hasta 64) sin datos personales.'
        - 'Paso 8 (vida): «hace menos de la vida» = deja de estar en curso al cumplir exactamente 600 s sin pulsos.'
        - 'Paso 9 (EPT-C02 vs EPT-C13): una fuente fuera de agente/subagente/comando es ErrFuenteInvalida; «comando» con la opción solo-agente es un error distinto, ErrFuenteNoAdmitida.'
        - 'Paso 10 (panel): «las más nuevas» = las PanelMax (8 por defecto) últimas tareas abiertas en el orden del archivo; las en curso se suman aunque queden fuera; las raíces y los hijos van en el orden del archivo. El JSON trae «vence» y el panel apaga «running» al pasar esa hora aunque lea un JSON viejo.'
        - 'Paso 10 (latido): el ● es tenue en segundos pares y brillante en impares (reloj de pared); el destello dura 1 s desde la lectura que ve el cambio de pulso; la primera lectura no destella. Los colores se entregan como estados (tenue/brillante/acento) y un dibujo ANSI de referencia (atenuado, negrita, cian), sin campana.'
        - 'Paso 11 (latidor): el tope de 5 s descarta los pulsos de más (no los acumula para después); la herramienta de tareas que lanza subagentes se configura por panel («Task»/«Agent» en Claude Code, «task» en OpenCode); el envío a la CLI va en una goroutine y sus fallas se ignoran. No construí la CLI («qdd estado activa/pulso/check»): la biblioteca expone las operaciones que esa CLI envolvería.'
      aprobada: true
