        - 'Arquitectura: el registro de actividad (en curso, pulso, fuente, vida, «● running») no tiene paso ni escenario; no se construyó.'
        - 'Arquitectura: el modelo (Tablero) vive en memoria; «no se escribe» significa que la operación lanza un error y el tablero queda igual. No hay CLI ni archivo.'
        - 'Paso 1: una celda sin fijar empieza en «❌ sin empezar».'
        - 'Paso 1: se ignora el selector de variación U+FE0F tras ✅ ⏳ ❌; la celda no puede llevar «|» ni saltos de línea (no se admite escapar «|»).'
        - 'Paso 1: una «—» dentro de la nota no es un segundo estado; «—» puede llevar nota.'
        - 'Paso 2: el commit se acepta en mayúsculas o minúsculas y debe ser una palabra aislada; la semver admite prerelease y build.'
        - 'Paso 2: «de quién» de un ⏳ = la nota contiene un rol de la lista (sin distinguir mayúsculas); «qué espera» = queda texto además del rol. No se puede detectar el nombre de una persona: solo se exige un rol.'
        - 'Paso 2: un ❌ vale si su nota tiene al menos una letra o cifra.'
        - 'Paso 3: «aprobado por <rol>» exige un rol de la misma lista que los bloqueos; el ⏳ de Producción no está obligado a decir «espera aprobación» (puede esperar otra cosa).'
        - 'Paso 4: «Validación real ✅ solo porque Producción está ✅» = la evidencia de Validación real está contenida en la de Producción (cuando Producción está ✅). Si trae otra evidencia, vale.'
        - 'Paso 5: «última etapa que aplica» = la última columna que no es «—»; dejar todas en «—» también cuenta como terminar. Descartar una tarea con dependencias pendientes sí se permite.'
        - 'Paso 5: la etiqueta solo nombra las dependencias que aún no terminaron; con varias, «(otro objetivo)» va tras cada una: «t (espera a x (otro objetivo), y)».'
        - "Paso 6: la fila \U0001F3AF muestra el nombre del objetivo (no su id) y los reportes se comparan por ese nombre; el nombre es único y «sin objetivo» está reservado."
        - "Paso 6: la última celda del \U0001F3AF es «<estado> <texto> · criterio: <criterio>»; la evidencia se busca solo antes de «· criterio:». Un objetivo descartado con tareas abiertas va como «— descartado: <motivo>»."
        - 'Paso 6: un objetivo sin tareas queda «⏳ 0/0 tareas listas»; cumplirlo no exige tener sus tareas terminadas, solo evidencia del criterio.'
        - "Paso 6: los ⏳ de las filas \U0001F3AF no exigen rol; el «en orden» de los objetivos es el orden de creación; con objetivos activados la tabla debe empezar por una fila \U0001F3AF."
        - 'Paso 6: un objetivo cerrado sale de la tabla cuando no le quedan tareas abiertas; una tarea cerrada o descartada sale de la tabla de inmediato.'
        - 'Paso 7: «recién cerradas» = el reporte en que una tarea u objetivo sale de la tabla trae su línea de cierre; el siguiente ya no la trae.'
        - 'Paso 7: el cierre de un objetivo se escribe «<objetivo>: cumplido — <evidencia>» o «<objetivo>: descartado — <motivo>» (la receta solo da el formato de las tareas); se acepta con viñeta «- » delante; el guion es «—».'
        - 'Paso 7: las afirmaciones «<tarea> · <etapa>: <estado>» se buscan solo fuera de la primera tabla, y el id de tarea no lleva espacios.'
        - 'Paso 7: teléfono = con «+» y 8 a 15 cifras, o agrupado como «9 1234 5678»; un número de 7 a 40 cifras seguidas es un commit, no un teléfono. Del identificador nacional solo se detecta el RUT.'
        - 'Paso 7: un token con prefijo conocido necesita al menos 8 caracteres tras el prefijo (12 en AKIA); «clave=», «token=» y «password=» sin distinguir mayúsculas y con espacios antes de «=» opcionales.'
        - 'Paso 7: los mensajes del lector nombran el tipo de secreto y la línea, nunca el secreto.'
