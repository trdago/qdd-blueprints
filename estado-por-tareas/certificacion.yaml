      supuestos:
        - 'Paso 7 / EPT-K02 / EPT-K03: «sin empezar» no es uno de los cuatro estados; en el archivo es una celda vacía (null) que no cuenta como avance al cambiar de ciclo ni como terminada, y en el reporte se dibuja «❌ sin empezar».'
        - 'Paso 2 / EPF-C03: «qué espera» se comprueba exigiendo, además del rol, al menos una palabra que no sea el rol ni relleno («espera», «de», «a»…). «del CI» cuenta como el rol «el CI». No se puede detectar un nombre propio: solo se exige un rol de la lista.'
        - 'Paso 3 / EPF-C06: Producción en ✅ exige siempre «aprobado por <rol>» (con rol de la lista); una nota de ⏳ en Producción que menciona aprobación debe decir «espera aprobación de <rol>».'
        - 'Paso 4 / EPF-C04 / EPT-S01: «sin uso real observado» se lee como: la evidencia del ✅ de Validación real no es más que la que ya tiene Producción en la misma fila; necesita evidencia propia.'
        - "Paso 6 / EPT-O06: la última celda de la fila \U0001F3AF se escribe «<estado> <nota> · criterio: <criterio>»; un objetivo descartado se dibuja «— descartado: <motivo>». Un objetivo abierto sin tareas queda «⏳ 0/0 tareas listas»."
        - "Paso 6 / EPT-O06: una tabla sin ninguna fila \U0001F3AF no se exige agrupada (reportes de proyectos sin objetivos)."
        - "Paso 6 / EPF-C03: el ⏳ de una fila \U0001F3AF («n/m tareas listas») no exige rol: las reglas de bloqueo aplican a celdas de tareas."
        - "Paso 8 / EPF-C05 / EPT-O05: los cierres se escriben con el nombre (lo que se lee), no con el id. Un objetivo se cierra en el texto con «\U0001F3AF <objetivo>: cumplido — <evidencia>» o «\U0001F3AF <objetivo>: descartado — <motivo>» (formato no dado por la receta)."
        - 'Paso 8 / alcance «recién cerradas»: una tarea cerrada no vuelve a la tabla; sale como línea de cierre en el primer reporte después de cerrarse. Un objetivo cerrado sigue en la tabla mientras tenga tareas abiertas y sale con su línea de cierre cuando deja de mostrarse.'
        - 'Paso 8 / EPF-C08: una afirmación «<tarea> · <etapa>: <estado>» se reconoce solo al comienzo de una línea (con o sin viñeta).'
        - 'Paso 8 / EPF-C07: teléfono = número con prefijo «+» o con grupos separados por espacio o guion (un número corrido de 8+ cifras no se trata como teléfono para no confundirlo con un id de corrida); RUT = formato con puntos o con guion y dígito verificador, sin validar el dígito. Otros identificadores nacionales los agrega el proyecto con secretos_extra.'
        - 'Paso 7 / EPT-K04: el lector reconoce el ciclo de cada tabla por sus columnas; con ciclos declarados, toda tabla debe ser de un ciclo y la primera la del proyecto. Sin ciclos declarados, solo revisa la primera tabla.'
        - 'Paso 5 / EPT-D02: también se rechaza agregar una dependencia no terminada a una tarea cuya última etapa que aplica ya está en ✅, y una tarea con todas sus etapas en «—» cuenta como terminando.'
        - 'Criterio de éxito (tarea en curso): ningún paso ni escenario la cubre; se hizo un registro mínimo (activar, pulso con fuente agente/subagente/comando, terminar, vida configurable) con ruta elegida por quien lo usa, sin CLI ni MCP.'
