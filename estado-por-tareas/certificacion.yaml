      supuestos:
        - 'General: no hay CLI; la API del paquete (Proyecto.Activar/Pulsar/Terminar/Marcar/Cerrar/Descartar/Reportar/Panel y Check) hace de ''qdd estado …'' y de la tool MCP; el Latidor recibe la CLI como función Enviar.'
        - 'Paso 1: el id de una tarea es una palabra (letras, dígitos, _ . -) y es lo que va en la primera columna; la tabla del reporte es una tabla de barras «| … |» con fila separadora opcional, y sus columnas deben ser exactamente las etapas elegidas, en orden.'
        - 'Paso 1: una tarea nueva arranca con todas sus celdas en «❌ falta: sin empezar» para que cada celda tenga un estado válido desde el inicio.'
        - 'Paso 1: se ignora el selector de variación U+FE0F (✅️ = ✅).'
        - 'Paso 2: el commit se acepta en mayúsculas o minúsculas; la versión semver admite pre-release y build; el id de corrida es [A-Za-z0-9_.#-]+ con al menos un dígito.'
        - 'Paso 2: un ⏳ vale si su nota dice «espera» y nombra un rol de la lista (comparando palabras sin artículos, sin distinguir mayúsculas); no se puede detectar un nombre propio, pero sin rol se rechaza.'
        - 'Paso 2: un ❌ vale si su nota tiene al menos una letra.'
        - 'Paso 3: como todas las etapas requieren aprobación, todo ✅ debe decir «aprobado por <rol>» además de su evidencia.'
        - 'Paso 3 / EPF-C04: un ✅ de Validación real debe nombrar el «uso real», su evidencia no puede ser solo la del despliegue (la de Producción) y no vale con Producción en ⏳ o ❌.'
        - 'Paso 4 / EPT-M01: una Puerta en «—» cuenta como no pasada; con la Puerta sin ✅ y evidencia, Producción en ⏳ debe mencionar «Puerta» y llevar un rol como cualquier ⏳ (p. ej. «⏳ espera la Puerta de QA»); en ❌ o — no se exige.'
        - 'Paso 5: la regla de término (EPT-D02) se aplica a la tarea que se escribe; cambiar una dependencia ya cerrada no reabre a quien la esperaba. Descartar no exige dependencias terminadas.'
        - 'Paso 5: en el reporte, las dependencias se leen de «(espera a X, Y)»; una espera a una tarea que no está en la tabla ni en los cierres no vale.'
        - 'Paso 6: las tareas cerradas o descartadas salen de la tabla y el reporte lista siempre todas sus líneas «<tarea>: cerrada|descartada — <motivo>»; una tarea con cierre que siga en la tabla es un error.'
        - 'Paso 6: la afirmación «<tarea> · <etapa>: <estado>» se busca solo en la prosa (fuera de la tabla), con la tarea como id.'
        - 'Paso 6 / EPF-C07: teléfono = «+» y 8 a 16 dígitos con espacios o guiones, o 9 a 12 dígitos seguidos (un commit solo de dígitos tan largo se tomaría como teléfono); RUT = 1-2 dígitos, dos grupos de 3 y dígito verificador, con o sin puntos.'
        - 'Paso 7: estado.yaml es YAML en bloque con valores en estilo flujo JSON (subconjunto válido de YAML) para leerlo solo con la biblioteca estándar; se escribe de forma atómica y solo si la tabla resultante cumple todas las reglas.'
        - 'Paso 7 / EPF-A01: el archivo guarda también las tareas cerradas; se compara con la respuesta así: tareas abiertas ↔ filas de la tabla y cerradas ↔ líneas de cierre.'
        - 'Paso 7 / EPT-K05: esta variante no tiene objetivos (objetivos → no), así que nunca hay ciclos propios; se prueba que cada fila trae un símbolo por etapa, que el JSON no trae ''ciclos'', que trae las etapas con abreviatura (3 primeras letras) y que la leyenda nombra el ciclo «proyecto». La parte de objetivos con ciclo propio no aplica.'
        - 'Paso 7 / EPT-A02: el panel muestra solo tareas abiertas; «más nuevas» = las últimas en el orden de la tabla (límite opcional, 0 = todas); los hijos van en orden de tabla bajo su padre.'
        - 'Paso 8: la actividad es un JSON por proyecto en <central>/actividad/<sha256(ruta absoluta)[:16]>.json; las entradas vencidas se descartan al leer; no hay bloqueo entre procesos (escritura atómica, gana la última).'
        - 'Paso 8: «última activada» = la de mayor hora de activación entre las que siguen en curso; un pulso con tarea que la enciende cuenta como activación. Activar registra un pulso de fuente agente con quién «activa».'
        - 'Paso 8: «terminar» es tanto apagarla a mano (Terminar) como que la tarea quede terminada (todas sus etapas en ✅ o —) al escribir una celda.'
        - 'Paso 8: «quién» debe parecer el nombre de una herramienta ([A-Za-z0-9_.:-], hasta 64) y no contener datos sensibles; si no, el pulso se rechaza (en el Latidor se reemplaza por «herramienta»).'
        - 'Paso 9 / EPT-C02 vs C13: una fuente desconocida es EPT-C02; «comando» es conocida pero no admitida por esta opción (EPT-C13). La fuente se valida antes que la tarea, así que un pulso sin tarea con fuente inválida también falla.'
        - 'Paso 10: el latido alterna por la paridad del segundo del reloj (pares brillante, impares tenue); la primera lectura de una fila no destella; el destello dura 1 s desde la lectura en que se vio el pulso nuevo.'
        - 'Paso 11: las herramientas que lanzan subagentes son «Task», «Agent» y la de tareas de OpenCode «task» (sin distinguir mayúsculas); el panel destella localmente con cada herramienta aunque el pulso a la CLI se omita por el tope de 5 s; si la CLI sigue ocupada, el pulso se descarta en vez de esperar.'
      aprobada: true
