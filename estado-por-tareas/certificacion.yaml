      supuestos:
        - 'Paso 7: .qdd/project/estado.yaml se escribe como JSON (que también es YAML 1.2) para no depender de un lector YAML.'
        - 'Paso 7 / EPF-A01: la tabla del reporte lleva las tareas abiertas; las cerradas y descartadas salen como «<id>: cerrada — <motivo>» al desaparecer.'
        - 'Paso 1: una celda nunca escrita se lee «❌ sin avance» (la receta no dice qué estado tiene una etapa sin avance).'
        - 'Paso 9: las referencias (celda, cierre, en curso, dependencia, módulo) son ids; un nombre no resuelve a la tarea.'
        - 'Pasos y decisiones: la primera columna de la tabla es el id de la tarea, para que cierres, afirmaciones y «espera a X» se comparen sin ambigüedad.'
        - 'Paso 2: el «qué» de un ⏳ es cualquier palabra de la nota distinta del rol y de relleno (espera, de, del, a, la, el…); el «de quién» es un rol de la lista base o del proyecto, buscado por su núcleo sin artículo («el CI» → CI).'
        - 'Paso 2: un commit se reconoce solo en hexadecimal en minúsculas, para no tomar palabras como «Decade1».'
        - 'Paso 3: como todas las etapas requieren aprobación, todo ✅ lleva además «aprobado por <rol>».'
        - 'EPF-C04: Validación real ✅ exige mencionar «uso real» y una evidencia propia que no sea la del despliegue de Producción.'
        - 'EPT-M01: la celda que espera la Puerta se escribe «⏳ espera la Puerta con su evidencia de QA» (el ⏳ necesita un rol).'
        - 'Paso 6 / EPF-C08: una afirmación «<tarea> · <etapa>: <estado>» se reconoce al comienzo de una línea (con o sin viñeta).'
        - 'EPF-C07: teléfono = número internacional con «+» o móvil chileno de 9 dígitos que empieza en 9; RUT = 12.345.678-5 o 12345678-5 sin validar dígito verificador; los mensajes nombran el tipo y nunca repiten el valor.'
        - 'Paso 10 / EPT-R0x: las fichas viven en .qdd/modules/<id>.json con {id, rutas, objetivo, decisiones, pruebas}; el cambio de ficha se mide contra la última versión commiteada antes de la última celda y HEAD.'
        - 'Paso 10: pasados 200 ms sin objetivos ni foco, el lector deja de mirar las tareas restantes y lo dice.'
        - 'Paso 11: la actividad vive en $QDD_HOME/actividad/<sha256 de la ruta del proyecto>.json (por defecto ~/.local/share/qdd).'
        - 'Paso 11: un pulso con tarea apagada la enciende como si se activara (pasa a ser la última activada).'
        - 'Paso 13 / EPT-C07: «las más nuevas» son las últimas 8 tareas abiertas en el orden del archivo.'
        - 'EPT-C09: la primera lectura de un panel no destella; solo un cambio de pulso entre dos lecturas.'
        - 'Paso 14 / EPT-C10: el destello local del panel ocurre con cada herramienta; solo el envío a la CLI se limita a uno cada 5 s por panel, guardado en un archivo por panel porque cada hook es un proceso nuevo.'
        - 'EPT-C12: las herramientas de subagente son Task y Agent (Claude Code) y task (OpenCode).'
        - 'EPT-K05 y EPT-A03: la variante no usa objetivos (crearObjetivo falla con objetivos: no); las pruebas de objetivos y ciclos propios activan objetivos en la configuración.'
        - 'EPT-K05: una etapa de ciclo sin abreviatura declarada toma sus 3 primeras letras, alargándola si choca.'
      aprobada: true
