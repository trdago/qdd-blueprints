      supuestos:
        - 'Paso 7 / EPT-K02-K03: «sin empezar» es una celda vacía en el modelo (None) que se dibuja «❌ sin empezar»; no cuenta como avance al cambiar de ciclo ni como terminada (si fuera «—» una tarea nueva ya estaría terminada).'
        - 'EPF-C04 / EPT-S01: un ✅ en Validación real exige evidencia, mencionar «uso real» y una evidencia distinta de la de Producción (si sus evidencias son un subconjunto de las de Producción, es ✅ solo por Producción).'
        - 'EPF-C03: «de quién» se reconoce buscando un rol de la lista (la persona, QA, el CI, producción + los del proyecto, sin distinguir mayúsculas); «qué espera» es que quede texto además del rol. Un nombre propio sin rol no vale.'
        - 'EPF-C06: la aprobación dada se reconoce por «aprobado por <rol>» con un rol de la lista; un ⏳ en Producción solo tiene que cumplir la regla general del ⏳.'
        - 'EPF-C02: commit = 7-40 hexadecimales (mayúsculas o minúsculas) con al menos un dígito y sin letras/dígitos pegados; semver acepta prerelease y build; «corrida #id» también vale.'
        - 'Paso 7 / EPT-K04: la tabla del proyecto es la primera y su cabecera de tarea es «Tarea»; cada tabla de ciclo se marca con la cabecera «Tarea · ciclo <nombre>». Otras tablas del texto se ignoran (pero se revisan por secretos).'
        - 'EPF-C08: una afirmación «<tarea> · <etapa>: <estado>» se reconoce solo al comienzo de una línea de texto (se admite viñeta); los cierres «<tarea>: cerrada|descartada — <motivo>» igual.'
        - "EPT-O05: un objetivo se cierra en el texto con «\U0001F3AF <nombre>: cumplido — <evidencia>» o «<nombre>: descartado — <motivo>» (el \U0001F3AF es opcional); un cumplido sin evidencia se informa como EPT-O04."
        - "EPT-O04 / O06: la fila \U0001F3AF de un objetivo abierto lleva «⏳ n/m tareas listas» o «⏳ tareas listas, falta verificar el criterio» seguido de «· criterio: <criterio>»; a esas filas no se les exige rol en el ⏳. Un descartado se dibuja «— descartado: <motivo>»."
        - 'EPT-O04: cumplir un objetivo solo exige evidencia de su criterio; no se exige que todas sus tareas estén terminadas.'
        - "EPT-O06: si el reporte no trae ninguna fila \U0001F3AF, una tabla plana de tareas también vale (proyecto sin objetivos). El foco va primero dentro de la tabla de su ciclo."
        - 'EPT-O03: cerrar (cumplir o descartar) el objetivo que es el foco lo deja sin foco; no se puede marcar como foco un objetivo cerrado.'
        - 'EPT-O02: una tarea puede agregarse o moverse a un objetivo ya cerrado mientras exista.'
        - 'EPT-D02: la «última etapa que aplica» es la última del ciclo que no está en «—» (incluida una sin empezar). Solo se comprueba al escribir la tarea que espera; si una dependencia luego retrocede (p. ej. a ❌), se permite, y el lector del reporte lo marca como EPT-D02.'
        - 'EPT-D02: la tabla nombra «(espera a …)» solo las dependencias que aún no terminan y solo en tareas abiertas; las de otro objetivo llevan «(otro objetivo)».'
        - 'EPF-C05: las tareas se identifican en la tabla por su id; una tarea cerrada o descartada en el reporte anterior ya no necesita repetir su cierre. Las tareas cerradas siguen en la tabla (el modelo no tiene reloj para saber cuáles son «recién cerradas»).'
        - 'EPF-C07: el hallazgo nombra el tipo y la línea, nunca el secreto; teléfono = con prefijo +código o en grupos 2-4/3-4/4 dígitos; RUT con o sin puntos y guion; los tokens con prefijo conocido exigen al menos 6 caracteres tras el prefijo; «Bearer» distingue mayúsculas.'
        - 'Destino respuesta: el estado vive en memoria (Proyecto) y se entrega como markdown con reporte(); cada escritura es atómica (copia, valida, reemplaza) y si falla lanza ErrorEstado con los ids de escenario y no escribe nada.'
        - 'Actividad (sin escenario): una sola tarea en curso por máquina; activa() cuenta como pulso del agente; en_curso es None si el último pulso tiene edad >= vida; se guarda en un JSON en la ruta que se le dé (fuera del proyecto); el panel recibe {tarea, estado: ''● running'', fuente}.'
