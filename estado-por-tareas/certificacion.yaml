      supuestos:
        - 'Escenarios (todos): Python no admite «-» en un nombre de método; cada prueba lleva el id como test_EPF_C01_… y el id exacto (EPF-C01) en su docstring.'
        - 'Arquitectura (tarea en curso, pulso, vida, actividad): ningún paso ni escenario la pide y el panel está fuera de alcance; no se construye, solo la revisión de reportes.'
        - 'Paso 2 / EPF-C03: «qué espera» se da por dicho si la nota tiene texto además del rol; «de quién» exige un rol de la lista (base + los del proyecto), así que un nombre de persona no vale.'
        - 'Paso 3 / EPF-C06: un ✅ en Producción exige, además de su evidencia, «aprobado por <rol>» con un rol de la lista; un ⏳ en Producción solo sigue las reglas de cualquier ⏳.'
        - 'Paso 4 / EPF-C04 / EPT-S01: el lector no puede saber si hubo uso real; un ✅ en Validación real se acepta solo si su nota dice «uso real» (además de su evidencia); si no, se rechaza.'
        - 'Paso 5 / EPF-C05: una tarea que el reporte anterior ya cerró o descartó con motivo (recién cerrada, según alcance → abiertos) puede no figurar en el nuevo sin otro cierre; un cierre sin motivo no vale.'
        - 'Paso 5 / EPF-C08: la tarea de una afirmación «<tarea> · <etapa>: <estado>» es el texto desde el comienzo de la línea (sin viñeta) o desde el último . ; : , ( « " antes del «·»; tarea y etapa se comparan sin distinguir mayúsculas y solo se compara el estado, no la nota.'
        - 'Paso 5 / EPF-C07: teléfono = número con prefijo internacional «+» y 8 a 15 dígitos; identificador nacional = RUT (con o sin puntos, guion y dígito verificador, sin validar el dígito); otros identificadores los agrega el proyecto como patrón extra.'
        - 'Paso 5 / EPF-C07: un token con prefijo conocido cuenta como secreto si el prefijo va seguido de al menos 8 caracteres [A-Za-z0-9_-] (para no marcar palabras como «sk-learn»); para Slack el prefijo es «xox», una letra opcional y «-» (xoxb-, xoxp-, …).'
