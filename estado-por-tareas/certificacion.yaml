      supuestos:
        - 'Arquitectura: se construyen dos piezas, un modelo en memoria (src/proyecto.ts) que rechaza toda operación inválida sin escribir nada (trabaja sobre una copia y solo la adopta si cumple todas las invariantes) y un lector automático de reportes markdown (src/revisor.ts); las reglas de celda son las mismas para ambos (src/celda.ts).'
        - 'Tarea en curso, pulso, vida y actividad: no tienen paso ni escenario en la receta y su registro vive fuera del proyecto; no se implementaron.'
        - 'Tarea: su id es también su nombre en la tabla (sin «|» ni «(»), para que dependencias, afirmaciones y cierres la nombren igual.'
        - 'Paso 7 / EPT-K02: una celda «sin empezar» se guarda como vacía (null) y se dibuja «❌ sin empezar»; no cuenta como avance al cambiar de ciclo, de modo que puede descartarse sin error.'
        - 'Paso 2 / EPF-C03: un ⏳ vale si su nota nombra un rol de la lista (base + los del proyecto, sin distinguir mayúsculas) y además dice algo más (qué espera); no se puede detectar un nombre de persona, así que exigir el rol es la regla.'
        - 'Paso 3 / EPF-C06: la aprobación se reconoce por «aprobado por <rol>» con un rol de la lista; una etapa que la requiere en ✅ sin eso no vale. El proyecto puede sumar etapas que requieren aprobación, no quitar Producción.'
        - 'Paso 4 / EPT-S01 / EPF-C04: Validación real ✅ exige evidencia, la frase «uso real» en la nota y que su evidencia no sea solo la misma que la de Producción.'
        - 'Paso 2: la evidencia de commit acepta hexadecimal en mayúsculas o minúsculas; cualquier cadena de 7 a 40 hex con un dígito cuenta, aunque sea solo de dígitos.'
        - 'Paso 5: solo se listan en «(espera a …)» las dependencias que aún no terminaron; una descartada sigue listada. Agregar una dependencia no terminada a una tarea cuya última etapa ya está ✅ se rechaza.'
        - 'Paso 5: el bloqueo se comprueba al marcar una celda o cerrar la tarea; si después una dependencia retrocede, la tarea que ya terminó no se toca.'
        - 'Paso 6: el estado del objetivo va en su última celda como «⏳ n/m tareas listas · criterio: …», «⏳ tareas listas, falta verificar el criterio · criterio: …», «✅ cumplido: <evidencia> · criterio: …» o «— descartado: <motivo> · criterio: …»; un objetivo sin tareas es «⏳ 0/0 tareas listas». Su ⏳ no exige rol.'
        - 'Paso 6: cumplir un objetivo exige evidencia (mismas formas que un ✅) pero no exige que todas sus tareas estén terminadas; cumplir o descartar el foco lo desmarca. «En orden» es el orden de creación. Dos objetivos no pueden llamarse igual.'
        - "Paso 6 / EPT-O05: el cierre de un objetivo se escribe «\U0001F3AF <objetivo>: cumplido — <evidencia>» o «\U0001F3AF <objetivo>: descartado — <motivo>»; un objetivo cerrado sigue en la tabla mientras tenga tareas abiertas."
        - 'Paso 8 / EPF-C05: las tareas cerradas o descartadas salen de la tabla; el reporte en que desaparecen (respecto del anterior generado) trae su línea de cierre: esas son las «recién cerradas».'
        - 'Paso 8 / EPF-C08: una afirmación es una línea de prosa (con o sin viñeta «- » o «* ») que empieza por «<tarea> · <etapa>: <estado>»; solo se compara la primera de cada línea.'
        - 'Paso 8 / EPF-C07: teléfono = formato internacional con «+» o móvil chileno de 9 dígitos que empieza por 9; RUT = con puntos o sin ellos y guion con dígito verificador (no se valida el módulo 11). Los hallazgos dicen el tipo y la línea, nunca el valor. El modelo también rechaza escribir secretos en celdas, nombres, criterios y motivos.'
        - 'Paso 7 / EPT-K04: las tablas de estado son la primera tabla del reporte y cada tabla posterior con la misma primera columna («Tarea»); con varios ciclos cada tabla va precedida por «**Ciclo «<nombre>»**». Si se le pasan los ciclos declarados, el lector exige que la primera tenga las etapas del proyecto y las demás las de algún ciclo; la tabla del proyecto se emite siempre.'
        - 'Paso 7: las etapas del ciclo «proyecto» también pueden cambiarse con cambiarEtapasCiclo, con la misma regla de no perder avance; el nombre «proyecto» está reservado sin importar mayúsculas.'
        - "Paso 6: en la tabla, una fila de tarea antes de toda fila \U0001F3AF (cuando la tabla tiene filas \U0001F3AF) no vale; «\U0001F3AF sin objetivo» va al final, una sola vez y con «—» en todas sus etapas; el foco debe ser la primera fila \U0001F3AF de su tabla."
        - Celdas con «|» se escapan como «\|» en la tabla y el lector las desescapa.
