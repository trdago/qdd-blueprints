      resultado: pruebas ✅ · escenarios con prueba 36/36
      supuestos:
        - 'General: el proveedor es AWS (hosting → aws, iac → cloudformation); S3, CloudFront, ACM, Route 53, IAM/STS y GitHub se simulan con dobles en memoria (tests/dobles). El doble de CloudFormation interpreta las plantillas reales (Ref, Fn::Sub, Fn::GetAtt, Fn::Join, Fn::ImportValue, DeletionPolicy) y el de CloudFront ejecuta la CloudFront Function real con node.'
        - 'General: las pruebas del JS (FEM-C09..C11, C13..C16, C18, C19, C24..C30, S01, A01 por la CDN) necesitan node en el PATH; sin node se marcan como omitidas, no como pasadas.'
        - 'Paso 1: el ''framework'' del front de ejemplo es un empaquetador mínimo en Python (fem/construccion.py) que pone hash a cada módulo y lo emite como ES module; el contrato es la carpeta de salida. La ''instalación limpia'' borra node_modules y corre `npm ci` solo si el lockfile tiene paquetes (el ejemplo no tiene dependencias).'
        - 'Paso 1 / FEM-C01: ''el lockfile no corresponde al manifiesto'' se interpreta como en `npm ci`: las dependencias declaradas en package.json difieren de las del paquete raíz del lockfile o no están resueltas.'
        - 'Paso 1 / FEM-C02: los source maps solo se generan con --mapas <carpeta>, fuera del artefacto y sin comentario sourceMappingURL; subirlos a la herramienta de errores queda fuera.'
        - 'Paso 2: la lista de variables públicas es front/variables-publicas.json (prefijo VITE_); los valores de cada ambiente están versionados en ambientes/<ambiente>.json (no son secretos), así no hay valores de respaldo de otro ambiente ni secretos en el repositorio.'
        - 'Paso 2 / FEM-C05: ''token con privilegios de servicio'' = JWT cuyo claim role es service_role/service/admin/supabase_admin; también se detectan llaves AWS (AKIA/ASIA), llaves privadas PEM, sk_live_/rk_live_ y tokens de GitHub. Un JWT anon/authenticated o una PEM pública no cuentan.'
        - 'Paso 3 / Paso 4: staging usa staging.ejemplo.com como canónico y www.staging.ejemplo.com como variante (la receta solo define apex/www para el dominio raíz).'
        - 'Paso 3: todo vive en us-east-1 (almacenamiento y certificado), por eso no hace falta separar pilas por región; el certificado va en la misma pila del ambiente.'
        - 'Paso 4: además de www, cualquier host que no sea el canónico (incluido el dominio por defecto de CloudFront) redirige con 301 al canónico, para no publicar el dominio del CDN.'
        - 'Paso 5: Permissions-Policy va como cabecera personalizada de la Response Headers Policy (CloudFront no la trae en SecurityHeadersConfig). Los orígenes declarados se agrupan por categoría (api, estilos, fuentes, pagos, mapas) y cada categoría entra en directivas fijas.'
        - 'Paso 6 / FEM-C32: además de las rutas con extensión, las que tienen un segmento que empieza con punto (/.git/config) se tratan como archivo (404, sin fallback). Rutas sin extensión ni punto (p. ej. /Dockerfile) reciben el index.html, nunca el archivo del repositorio.'
        - 'Paso 7: ''assets con hash'' = archivos en assets/ con un hash hexadecimal de 10 caracteres en el nombre; todo lo demás es punto de entrada. Un asset con hash que ya existe no se vuelve a subir.'
        - 'Paso 7 / FEM-C17: el candado de un despliegue a la vez es el grupo `concurrency` de GitHub Actions por ambiente (cancel-in-progress: false); ColaDespliegues reproduce y prueba esa semántica (uno corre, uno espera, el pendiente reemplazado queda ''reemplazado''). La limpieza y la vuelta atrás comparten el grupo del ambiente.'
        - 'Paso 8: el freno se guarda en sessionStorage; si no está disponible no se recarga (no habría freno que sobreviva a la recarga) y se muestra el aviso. El botón Reintentar navega a la ruta pedida sin borrar el freno.'
        - 'Paso 9: el `sub` del token OIDC se personaliza a repo+context+ref (repo:ORG/REPO:environment:ENV:ref:REF) para que la confianza exija a la vez el ambiente y la rama principal. Formato asumido de la personalización de GitHub; verificar al aplicar el arranque del repo.'
        - 'Paso 9: los roles de despliegue viven en la pila de cada ambiente (necesitan el ARN de su bucket y su distribución), con un límite de permisos de la pila de arranque; los roles de infraestructura y de ''plan'' (solo conjuntos de cambios, para que el PR los muestre) viven en la pila de arranque.'
        - 'Paso 9 / FEM-C22: la vuelta atrás manual y la limpieza usan un ambiente de GitHub ''<ambiente>-operacion'' sin revisores y solo desde main, que el rol de despliegue también acepta; así volver a una versión ya verificada no pide otra aprobación.'
        - 'Paso 9 / FEM-C23: la auditoría en el CI es `npm audit --audit-level=high`; fem/auditoria.py la reproduce contra una base de avisos en memoria (sin red).'
        - 'Paso 10: los previews comparten un bucket con prefijo pr-<n>/ y una distribución con certificado y DNS comodín *.previews.ejemplo.com; la función de borde mapea el subdominio al prefijo. ''14 días sin cambios'' = el último objeto subido bajo el prefijo tiene más de 14 días.'
        - 'Paso 11: ''versiones guardadas'' = los últimos 10 commits distintos del historial de despliegues exitosos del ambiente; la fecha en que un asset ''queda fuera'' es la del despliegue que sacó de la ventana a la última versión que lo usaba (si ninguna versión registrada lo usa, su fecha de subida). Los artefactos guardados que salen de la ventana se borran.'
        - 'Paso 11 / FEM-C28: si la API está caída, el despliegue queda registrado, se avisa ''API caída'', no se revierte y el pipeline NO falla (la receta no dice si falla).'
        - 'Paso 12: el contrato CORS (fem/cors.py) es la configuración que la API de cada ambiente debe cargar; la API real queda fuera de alcance y se prueba con un doble que usa esa misma lógica. En desarrollo, sin VITE_API_URL, el front llama a /api y el proxy local (fem/servidor_dev.py) lo reenvía.'
        - 'Workflows: se escriben en el subconjunto JSON de YAML (todo JSON es YAML válido) para leerlos con la biblioteca estándar.'
        - Cuenta 123456789012, repositorio mi-org/front-ejemplo y dominio ejemplo.com son valores de ejemplo.
