      supuestos:
        - 'hosting → otro_proveedor: la receta no dice cuál es el proveedor por defecto ni cuál es el «otro»; como el Paso 3 fija sa-east-1 (nombre de región de AWS) se eligió AWS (S3 + CloudFront + ACM + Route 53 + WAFv2 + IAM/OIDC) y el contrato queda mapeado en docs/contrato-proveedor.md. Los servicios se simulan en memoria (sim/cloud.ts).'
        - 'Paso 3 «cada ambiente (produccion)»: se construyeron staging, producción y la pila de previews, porque FEM-C21, FEM-R01, los previews (API de staging) y el WAF en modo conteo exigen staging.'
        - 'iac → terraform: el modelo neutral (infra/model.ts) es la fuente de verdad y genera Terraform en sintaxis JSON (infra/terraform/*/main.tf.json). No hay terraform instalado ni red: el apply, el plan sin diferencias y el bloqueo del estado se prueban con dobles (sim/terraform.ts).'
        - 'CI: se eligió GitHub Actions (OIDC de token.actions.githubusercontent.com, ambientes con revisores y reglas de rama); la receta no nombra el CI.'
        - 'Paso 7 vs configuracion → runtime: el borrado de «archivos sin hash que ya no están en el artefacto» exceptúa config.json, que se genera por ambiente y se publica junto al artefacto.'
        - 'Paso 7: un asset con hash se reconoce por el nombre (segmento de 8+ caracteres con algún dígito antes de la extensión), sin depender de la herramienta de build.'
        - 'dominio_canonico → www: se aplica a producción (ejemplo.com → www.ejemplo.com). Staging usa un solo host (staging.ejemplo.com) sin variante y los previews pr-<n>.preview.ejemplo.com con un certificado comodín.'
        - 'CORS de staging con previews: «subdominios del dominio de previews» + «comparando el origen exacto» se resolvió con una expresión anclada ^https://pr-[0-9]{1,6}\.preview\.ejemplo\.com$ que compara el origen completo y lo devuelve tal cual.'
        - 'Variables «propias de cada ambiente»: mismos nombres que el código lee (PUBLIC_API_URL…), definidos por ambiente del CI (GitHub Environments) y leídos sin respaldo desde otro ambiente ni desde el repositorio.'
        - 'FEM-C03 con configuración runtime: las variables del build (PUBLIC_APP_NAME) fallan antes del build; las del ambiente (PUBLIC_API_URL) fallan antes de subir nada al generar el config.json.'
        - 'Vuelta atrás sin otra aprobación: como en GitHub la aprobación va atada al ambiente, la vuelta atrás manual corre en un ambiente production-rollback (solo main, sin revisores) que el rol de producción también acepta, y el script solo acepta versiones que ya pasaron por producción.'
        - 'El plan en el PR necesita credenciales y el rol de infraestructura solo se asume desde main: se agregó un rol de solo lectura para el plan (pull_request).'
        - 'Verificación: primero el chequeo de salud de la API; si no responde se informa «API caída» y no se revierte; si responde, un preflight rechazado sí cuenta como fallo y revierte.'
        - 'Limpieza: «quedar fuera» = cuando la última versión que usaba el asset salió de las 5 guardadas (al desplegarse la quinta versión más nueva que ella); el plazo de 7 días cuenta desde ese momento, no desde la subida del asset. Versión = commit distinto.'
        - El CDN guarda el punto de entrada en el borde (TTL mínimo 300 s) aunque lleve no-cache para el navegador; por eso la invalidación es obligatoria.
        - 'Página 404 de un preview: el doble sirve la 404.html del mismo PR; en CloudFront la respuesta de error personalizada tiene una sola ruta fija por distribución.'
        - Los artefactos se manejan como texto (UTF-8); el sitio de ejemplo no tiene binarios.
        - No se generan source maps (no hay herramienta de errores en el alcance).
        - Historial de despliegues en meta/<ambiente>/releases.json del bucket del ambiente, fuera del origin_path (site/) que sirve el CDN; artefactos por commit en el bucket versionado de la pila de arranque.
        - 'Un pendiente reemplazado (concurrency de GitHub con cancel-in-progress: false) se informa como «reemplazado».'
        - 'Preview «sin cambios»: se mide desde su último despliegue (último push al PR).'
      aprobada: true
