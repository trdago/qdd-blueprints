      supuestos:
        - 'Arquitectura: la barra se construye solo en Go (barra.Formatear y ''qdd consola statusline'' en cmd/qdd); no se escribe referencias/statusline.sh con jq, se modela la misma salida.'
        - 'Arquitectura: ''qdd'' es un simulador construido en esta carpeta (paquete qdd y cmd/qdd); las pruebas usan HOME y QDD_HOME temporales y nunca el qdd instalado.'
        - 'Barra: el JSON de la consola trae model.display_name (o model.id), workspace.project_dir/current_dir, cwd, context_window.used_percentage y rate_limits.five_hour/seven_day con used_percentage y resets_at.'
        - 'Barra: resets_at numérico mayor que 1e12 se toma como milisegundos; un texto numérico también es epoch; la hora se muestra en la zona local.'
        - 'Barra: el relleno es U+2800 seguido de espacios y va en toda línea que lleva algo a la derecha; una línea con solo la izquierda no lleva relleno.'
        - 'CCC-C06: qdd anota el modo por sesión en <QDD_HOME>/consola/modo/<session_id>.json (modo y hora) desde el gancho UserPromptSubmit; el modo de otra sesión no vale; nombres: default=normal, acceptEdits=acepta ediciones, bypassPermissions=sin permisos.'
        - 'CCC-C07: angosta significa que izquierda + 2 + derecha no cabe en ancho-6; entonces la izquierda sale sola y el elemento de la derecha baja a la línea siguiente (se junta con la carpeta si cabe).'
        - 'CCC-C14/C15/C16: CPU sale de /proc/stat (ocioso = idle+iowait) con la lectura anterior guardada en <QDD_HOME>/consola/recursos.json; GPU no NVIDIA desde /sys/class/drm/cardN (gpu_busy_percent; sin ese archivo es «—»); nvidia-smi se consulta como mucho cada 5 s y se espera 300 ms en una goroutine; si tarda, sale la última lectura.'
        - 'CCC-C14: el segmento de recursos es el último elemento de la lista de la derecha; se activa con <QDD_HOME>/consola.json {recursos: true} que escribe ''qdd consola activar --recursos''.'
        - 'CCC-C05: la autocompactación de Claude Code se modela con config.Conversacion (resume al llegar a la ventana y conserva la tarea en curso); las decisiones se aplican como model=sonnet, effortLevel=xhigh y modelSettings.sonnet.autoCompactWindow=200000.'
        - 'CCC-C08: instalar el panel = escribir un marketplace local en <QDD_HOME>/marketplace, registrarlo en extraKnownMarketplaces.qdd (source directory), activar enabledPlugins[qdd-tareas@qdd], quitar qdd-estado@qdd y anotar la versión en ~/.claude/plugins/installed_plugins.json.'
        - 'CCC-C08/C35: una barra es de QDD solo si su comando es exactamente ''qdd consola statusline'', la forma directa «"<ruta>" consola statusline || qdd consola statusline» o el script del blueprint (~/.claude/qdd-statusline.sh); cualquier otra, aunque se parezca, es propia y no se toca.'
        - 'CCC-C33/C34/C35: qdd está instalado por npm si la ruta de su ejecutable contiene /node_modules/; sin npm, una barra de QDD ya puesta no se cambia; caracteres que impiden la ruta directa: comillas simples y dobles, $, `, %, barra invertida y saltos de línea.'
        - 'CCC-C09: doctor compara la versión anotada del panel con la de qdd (CON-02) y la ruta directa de la barra (CON-06); --fix reutiliza activar sin encender recursos.'
        - 'CCC-C23: OpenCode está si hay ''opencode'' en el PATH o ~/.config/opencode; el panel se escribe en ~/.config/opencode/plugin/qdd-tareas.js (versión, intervalo 2000 ms, comando panel --json, sin acciones) y se registra una vez en la lista plugin de tui.json con respaldo tui.json.bak; en Go se modela con Panel.SoloLectura.'
        - 'Estado: .qdd/project/estado.yaml se guarda como JSON (que es YAML válido); pedidos y turno en .qdd/project/consola/cola.json; fichas en .qdd/project/modules/<id>.json con estado borrador/aprobada.'
        - 'CCC-C13: «4 de 9 tareas» es mostradas de pendientes; ⏳ y ❌ del resumen cuentan etapas de las tareas abiertas; el resumen va en rojo si hay ❌, amarillo si hay ⏳ y verde si no; la peor etapa es ❌ > ⏳ > pendiente > ✅.'
        - 'CCC-C12: ''qdd estado check'' valida que el estado se lea, que cada tarea tenga id y nombre, que las dependencias existan y que los estados de etapa sean conocidos.'
        - 'CCC-C11/C26: las acciones de fila (✕, atender) y de pedido (ejecutar, quitar) no van en «Acciones»; allí solo van las de tipo conocido con tecla y etiqueta; los tipos que el panel siempre conoce son aprobar, revisar, auditar, abrir, descartar, ejecutar y quitar; atender es opcional (--con atender).'
        - 'CCC-C17/C24: teclas de pedidos en orden abdefghijkmpqrtvwyz (sin c, l, n, o, s, u, x); un pedido oculto conserva su tecla; volver a pedirlo es mismo comando y misma tarea.'
        - 'CCC-C24: cada mensaje de la persona sube un turno (''qdd consola ciclo''); un pedido sale de «▶ Para ti» si su tarea cambió en un turno posterior al del pedido.'
        - 'CCC-C20: abrirse solo = Panel.Abierto pasa a verdadero sin tocar Panel.Foco; se avisa una vez por número de serie del pedido.'
        - 'CCC-C21: el abridor se busca en orden xdg-open, open, explorer y se lanza sin esperar.'
        - 'CCC-C22: el motivo de una tarea descartada desde el panel es «descartada por la persona desde el panel».'
        - 'CCC-C25: el mensaje para atender usa el id de la tarea en la instrucción (no se acorta) y el nombre y lo esperado como lo citado (se acortan con «…»); si la etapa ya no espera, qdd rechaza el id con el estado actual de la etapa y el panel lo muestra.'
        - 'CCC-C27: hay árbol si hay objetivos o dependencias; el prefijo de una tarea que espera a otra del mismo objetivo es «└ » (dos espacios más por nivel); el estado del objetivo es «N abiertas · ⏳ n · ❌ n»; los objetivos sin tareas mostradas no salen.'
        - 'CCC-C28: la pregunta es «¿Cómo vamos con «X»? Dime avance, bloqueos y siguiente paso, y actualiza el estado.» (con «el objetivo» para objetivos).'
        - 'CCC-C30: el pedido del escenario (truncado en la receta) es «Merge #7»; la línea lista pedidos ejecutables, fichas en borrador y etapas ⏳ cuyo dueño es «persona»; cuando deja de esperar algo se envía una vez «Ya no espera nada de la persona»; un qdd viejo se reconoce porque Ciclo(--contexto) devuelve ErrSinContexto.'
        - 'CCC-C31: es de qdd una tool mcp__qdd__* o un Bash cuyo comando (o un comando tras ; & | o paréntesis) es qdd o una ruta que termina en /qdd; el gancho PostToolUse se modela con ''qdd consola panel --releer''.'
        - 'CCC-C32: el pedido dependiente guarda las teclas a las que espera (--despues); marcar hecho por la persona es ''qdd consola hecho <tecla> -n nota'' (estado hecho_persona) y libera a quien lo esperaba.'
        - 'CCC-C36-C39: el registro es <QDD_HOME>/proyectos.json con una lista de rutas; el historial de puntajes está en .qdd/project/metrics/puntajes.json (en, puntaje, escala, findings_abiertos); findings abiertos se cuentan en .qdd/project/findings.json (estado abierto); ⏳ y ❌ salen de estado.yaml.'
        - 'CCC-C36: sin historial, puntaje y hace cuánto dicen «sin medir»; sin findings.json o sin estado.yaml esas columnas también dicen «sin medir» (nunca 0).'
        - 'CCC-C37: una ruta del registro que no existe (o no es carpeta) dice «no existe» y no se leen sus métricas.'
        - 'CCC-C38: la escala actual es qdd-100; si el último puntaje es de otra escala, puntaje y hace cuánto dicen «sin medir»; el historial agrupa por día UTC y escala y muestra la otra escala aparte bajo «Otra escala (no se compara)».'
        - 'CCC-C39: la vista se modela con VistaProyectos: cerrada no llama a ''qdd consola proyectos'' ni dibuja nada; Abrir lee una vez; ↻ lee de nuevo solo abierta; hace cuánto es «hace N min/h/d».'
