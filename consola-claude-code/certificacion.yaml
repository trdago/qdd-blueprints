      supuestos:
        - 'Arquitectura: todo en Go con biblioteca estándar; la barra es ''qdd consola statusline'' (cmd/consola statusline) y no se escribió referencias/statusline.sh en shell con jq/date; el ancho se lee igual, con ''stty size'' sobre /dev/tty (0 si no se puede).'
        - 'CCC-C01: forma del JSON de la consola: model.display_name (o model.id), workspace.project_dir, luego workspace.current_dir, luego cwd; context_window.used_percentage; rate_limits.five_hour y rate_limits.seven_day con used_percentage y resets_at.'
        - "CCC-C01: el relleno es U+2800 seguido de espacios; los emoji (\U0001F4C2 ⏳ ✅ ❌ \U0001F3AF) ocupan 2 columnas; la línea mide ancho − 6; si algo no cabe, la consola lo corta."
        - 'Invariante de redondeo: math.Round (mitad hacia arriba): 37,6 → 38 y 12,2 → 12.'
        - 'Pasos (días): abreviaturas dom lun mar mié jue vie sáb (con tilde); «5h» lleva solo HH:MM y «semana» lleva día y HH:MM, en la zona local.'
        - 'CCC-C03: un resets_at numérico (o texto numérico) mayor que 1e11 se toma como milisegundos; ISO acepta RFC 3339 con o sin zona; lo que no se entiende se omite.'
        - 'CCC-C07: angosta = un elemento de la derecha no cabe junto al de la izquierda con 1 columna de separación; entonces baja a la línea siguiente (vale para todas las líneas, no solo el contexto).'
        - 'barra → minima: una línea «modelo · modo» y «contexto N%»; con recursos, el segmento va en una segunda línea; se activa con --minima en el comando de la barra; sin --minima es la barra completa de los escenarios C01–C07.'
        - 'CCC-C06: qdd anota el modo con ''qdd consola modo <modo>'' en ~/.local/state/qdd/consola/modo.json ({modo, cuando}), un archivo por usuario; ids traducidos: default → normal, acceptEdits → acepta ediciones, plan, auto, bypassPermissions → sin permisos, dontAsk → no pregunta.'
        - 'CCC-C05: la compactación la hace Claude Code; se modela como una Sesion con un Resumidor inyectado (doble en la prueba) que compacta cuando tokens ≥ autoCompactWindow y deja la indicación de seguir con la tarea en curso; modelSettings se indexa con el mismo alias del modelo («sonnet»).'
        - 'CCC-C14: D por statfs como df (usado / (usado + disponible)); R por /proc/meminfo (MemTotal − MemAvailable); C por /proc/stat entre dos corridas, guardando la muestra en ~/.cache/qdd/recursos.json; NVIDIA por ''nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits'' ([N/A] → «—»); otras GPU por /sys/class/drm/cardN con vendor ≠ 0x10de: gpu_busy_percent legible da %, si no «—». Solo Linux.'
        - 'CCC-C15: un contador que no existe (sin /proc, sin statfs, sin nvidia-smi, primera lectura de CPU) se omite; una tarjeta drm que existe sin lectura sale «—».'
        - 'CCC-C16: los 5 s se cuentan desde el último intento a nvidia-smi (aunque fallara o pasara de 300 ms); una respuesta tardía se descarta y se usa la última lectura guardada.'
        - 'CCC-C08: el panel se instala escribiendo un marketplace local en ~/.local/share/qdd/marketplace (marketplace.json y qdd-tareas/.claude-plugin/plugin.json con la versión de qdd) y registrándolo en ~/.claude/settings.json (extraKnownMarketplaces.qdd de tipo directory, enabledPlugins qdd-tareas@qdd = true, se quita qdd-estado@qdd); se supone que Claude Code lo instala desde ahí. La interfaz del mod se construyó como el paquete Go panel (lógica probable), no como código del mod de Claude Code.'
        - 'CCC-C08: es barra propia cualquier statusLine cuyo comando no empiece con ''qdd consola statusline'' ni termine en ''qdd/statusline.sh'' (el script de la receta); solo se reemplaza con --forzar; un settings.json inválido no se toca; antes de cambiarlo se respalda en settings.json.bak-qdd.'
        - 'CCC-C09: doctor compara la versión de plugin.json con la de qdd (también revisa barra, panel viejo y OpenCode); --fix vuelve a activar conservando las banderas --recursos/--minima de la barra actual; ''qdd consola doctor'' sale con 1 si queda un hallazgo reparable.'
        - 'CCC-C23: OpenCode se detecta por ''opencode'' en PATH o por ~/.config/opencode; el panel es ~/.config/opencode/plugins/qdd-tareas.js, registrado por su ruta en la lista «plugin» de ~/.config/opencode/tui.json (respaldo tui.json.bak-qdd); la API de plugins de OpenCode que usa el archivo (api.$, api.sidebar.render) es supuesta.'
        - 'Estado: .qdd/project/estado.yaml se lee y escribe en sintaxis JSON (subconjunto de YAML) por usar solo biblioteca estándar; esquema supuesto: en_curso, objetivos[id, nombre, foco], tareas[id, nombre, objetivo, depende_de, estado (pendiente|terminada|descartada), motivo, creada, etapas[nombre, estado (hecha|espera|falla|pendiente), espera, de_quien]]; campos desconocidos no se conservan al reescribir.'
        - 'CCC-C10: las fichas en borrador vienen de ''qdd modules list --json'' ([{id, estado: borrador}]); aprobar corre ''qdd modules approve <id>'', auditar ''qdd audit'' y revisar ''qdd estado check'' (CCC-C12), todos en la carpeta del proyecto.'
        - 'CCC-C13: «N esperan» y «N fallan» cuentan tareas abiertas con al menos una etapa ⏳ o ❌; «más nuevas» por el campo creada; una tarea terminada, descartada o con todas sus etapas hechas sale; las partes del resumen en cero se omiten; color del resumen: rojo con fallas, amarillo con esperas, verde si no.'
        - 'Teclas: aprobar 1…9, c, u, o, l; pedidos con a b d e f g h i j k m p q r t v w y z (sin c l n o s u x); la ✕ de cada tarea visible tiene tecla «✕1…✕4»; atender tiene tecla «e1…» (botón de la tabla); «x  Descartar» es el segundo paso de un pedido (acción quitar:<id>).'
        - 'CCC-C17: los pedidos se guardan en .qdd/consola/pedidos.json del proyecto (estado local de qdd); la clave por defecto es el id (p1, p2…); --despues/--antes usan claves; el motivo se cuenta en caracteres (runas).'
        - 'CCC-C18: exit 0 → hecho (sale de la cola); exit 75 → «todavía no» en gris y sigue en la cola; otro código → fallo, queda para reintentar con su salida; el comando corre con ''sh -c'' en su carpeta.'
        - 'CCC-C32: una dependencia que no está pendiente en la cola (hecha, descartada o ausente) no bloquea; marcar hecho es ''qdd consola pedir --hecho <tecla> --nota …'' y solo vale para pedidos visibles.'
        - 'CCC-C24: la tarea cambió cuando cambia su huella (sha256 del JSON de la tarea); la base se fija en el primer ciclo (mensaje de la persona) después de pedirlo; el panel y el ciclo ocultan el pedido si la huella difiere de la base; pedirlo de nuevo (misma clave, o misma tarea y comando) lo vuelve a mostrar con su tecla, que queda reservada mientras está oculto.'
        - 'CCC-C25: id de atender = atender:<tarea>:<índice de etapa>; también se atienden etapas ❌; mensaje: ''[qdd · atender] ⏳ «etapa» de «tarea» espera: <qué> (de <quién>). Intenta completarla; si falta algo, deja un pedido con la tarea «tarea» (qdd_consola_pedir) o pregunta.''; para caber en 280 se acorta con «…» el campo más largo (tarea, etapa o lo citado), nunca las instrucciones.'
        - 'CCC-C26: el único tipo opcional es atender; el panel pide con --con solo los opcionales que sabe dibujar y además filtra tipos desconocidos y acciones sin tecla o sin etiqueta.'
        - 'CCC-C27: el objetivo foco va primero y el resto en el orden del archivo; solo se dibujan objetivos con tareas visibles; prefijo de un nivel «├─ »/«└─ »; dentro de un objetivo, una tarea va después de las que espera; «espera a X» lista dependencias abiertas; estado del objetivo «N de M hechas»; si el estado no tiene objetivos no hay cabeceras.'
        - 'CCC-C28: la pregunta es ''¿Cómo vamos con «X»? Dime avance, bloqueos y siguiente paso, y actualiza el estado.'' (''el objetivo «X»'' para objetivos) y viaja en cada fila del JSON del panel.'
        - 'CCC-C30: línea ''[qdd · panel] Espera a la persona: pedido <tecla> «motivo» · ficha «id» en borrador · etapa ⏳ «etapa» de «tarea». Si su mensaje acepta, rechaza o deja sin efecto algo…''; solo cuentan pedidos ejecutables, fichas en borrador y etapas ⏳ con de_quien = persona; la última línea se guarda en .qdd/consola/ciclo.json; cuando deja de esperar algo se envía una vez ''Ya no espera nada de la persona.''; un qdd sin --contexto (sale con error) recibe ''qdd consola ciclo'' sin la bandera y el panel no muestra nada.'
        - 'CCC-C31: es de qdd una tool cuyo nombre empieza con mcp__qdd o qdd_, o un Bash con algún segmento (&&, ||, ;, |) que ejecuta qdd (también con ruta o variables delante).'
        - 'CCC-C20: se abre una vez por lectura que trae pedidos no vistos, sin foco, si el panel está cerrado o sin tareas; en la primera lectura los pedidos que ya existen cuentan como nuevos.'
        - 'CCC-C21: el abridor se busca en PATH (xdg-open, open o explorer según el sistema) y recibe la ruta del proyecto; el panel muestra solo el nombre de la carpeta.'
        - 'CCC-C22: motivo por defecto ''descartada por la persona desde el panel'' (o --motivo en ''qdd consola accion'').'
        - 'Pasos (estado-por-tareas): «● running» alterna ●/○ con cada pulso (Panel.Latir); «l ↻» se dibuja en la línea de acciones.'
        - 'Panel en la consola: fullscreen, /tareas y posición junto a la conversación dependen de Claude Code; se modelan con las interfaces Ventana y Conversacion y con dobles en las pruebas.'
        - 'Carpeta del proyecto en ''qdd consola'': la más cercana hacia arriba que tiene .qdd; si no hay, la carpeta actual. La versión de qdd se fija con -ldflags -X main.Version (0.0.0-dev por defecto).'
      aprobada: true
