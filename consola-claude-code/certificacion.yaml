      supuestos:
        - 'Arquitectura: la lógica de la barra está en referencias/statusline.py (Python en vez de jq y date); referencias/statusline.sh es un envoltorio bash que lo ejecuta con python3 -I'
        - 'Arquitectura: forma del JSON de la consola supuesta: model.display_name|id, workspace.project_dir|current_dir, cwd, session_id, context_window.used_percentage, rate_limits.five_hour|seven_day.{used_percentage,resets_at}'
        - 'Arquitectura: el ancho se lee con ioctl TIOCGWINSZ (lo mismo que stty size) sobre /dev/tty; la variable QDD_BARRA_TTY cambia esa ruta para las pruebas (una pty con 70 o 36 columnas, o una ruta inexistente para ''sin ancho'')'
        - 'Modo de la IA: qdd lo anota en ~/.qdd/consola/modo/<session_id> (una palabra: default, acceptEdits, plan, auto…) o en la ruta de QDD_MODO_ARCHIVO; se traduce a normal, acepta ediciones, plan, auto'
        - 'Configuración: configurar.py escribe <HOME>/.claude/settings.json (model=opus, effortLevel=high global, modelSettings.opus.autoCompactWindow=400000, statusLine {type: command, padding: 0}) y copia la barra a <HOME>/.claude/qdd-barra/; conserva el resto de claves'
        - 'Configuración: una statusLine con otro comando se conserva salvo --reemplazar-barra; solo se cubre barra=completa y consola_qdd=no (sin panel)'
        - 'Relleno: entre izquierda y derecha va U+2800 seguido de espacios, y la parte derecha termina en la columna ancho-6; U+2800 cuenta 1 columna y los emoji de ancho W/F cuentan 2'
        - 'CCC-C01: 3 líneas; la 3.ª empieza con el relleno (U+2800) porque no tiene texto a la izquierda'
        - 'CCC-C03: epoch en segundos o milisegundos (>1e11), número o texto; ISO sin zona se toma como UTC; la hora se muestra en la zona local (TZ)'
        - 'CCC-C04: la carpeta sale de workspace.project_dir, si no de workspace.current_dir, si no de cwd; si no llega ninguna, se omite'
        - 'CCC-C05: la compactación real la hace Claude Code; se prueba la configuración escrita y un modelo (compactacion.py) que compacta al llegar a la ventana y retoma la tarea del resumen sin pedirla'
        - 'CCC-C07: angosta = el contexto no cabe junto a «modelo · modo» con al menos una columna de relleno; entonces la lista derecha baja una fila y se reparte con el mismo criterio; sin ancho, cada elemento restante va en su propia línea'
        - 'Invariantes: un porcentaje que no es número (p. ej. texto) se omite; un texto con forma de correo se omite; JSON inválido no imprime nada y sale con 0'
        - 'Segmento de recursos (D/G/R/C): no se construye, la variante sugerida y sus escenarios no lo piden'
