      supuestos:
        - 'Arquitectura: el script de barra es referencias/statusline.py (Python, biblioteca estándar) en vez de statusline.sh con jq y date'
        - 'Arquitectura: ~/.claude/settings.json se construye como usuario/settings.json de esta carpeta (lo genera configuracion.py); nunca se toca ~/.claude'
        - 'Arquitectura: campos del JSON de la consola: model.display_name (o model.id), workspace.project_dir, workspace.current_dir, cwd, context_window.used_percentage, rate_limits.five_hour y rate_limits.seven_day con used_percentage y resets_at'
        - 'Arquitectura: el ancho se lee de CONSOLA_COLUMNAS si existe (vacío = desconocido) y si no del tamaño de /dev/tty (ioctl, equivalente a stty size)'
        - 'Modo de la IA: archivo local de texto plano (primera línea) en CONSOLA_MODO_ARCHIVO o $XDG_STATE_HOME/qdd/consola/modo; se traducen default, acceptEdits, plan, auto, bypassPermissions y dontAsk'
        - 'Modelo: la clave de modelSettings es el alias «opus», igual que model'
        - 'Carpeta: si no llega project_dir se usa current_dir y luego cwd del JSON (no el directorio del proceso)'
        - 'Porcentajes: se redondean a entero con la mitad hacia arriba; valores negativos, NaN o no numéricos se omiten'
        - 'Renovación: un ISO sin zona se toma como UTC; la hora se muestra en la zona local del sistema'
        - 'Días: abreviaturas lun, mar, mié, jue, vie, sáb, dom (con tilde)'
        - 'Segmento de recursos (D/G/R/C): no se construye; la decisión barra=completa y CCC-C01 piden solo 3 líneas'
        - 'Relleno: siempre empieza con U+2800 y sigue con espacios; una línea de la derecha que no cabe ni sola se emite sin alinear para que la consola la corte'
        - 'CCC-C07 angosta: si una línea de la derecha no cabe junto a la izquierda, baja y se empareja con la siguiente línea izquierda que la admita'
        - 'CCC-C05: la compactación la hace la consola; se prueba la configuración generada y un modelo simulado del contrato dentro de las pruebas'
        - 'Credenciales: la barra solo muestra modelo, modo, nombre de carpeta y porcentajes, y quita caracteres de control y secuencias ANSI'
