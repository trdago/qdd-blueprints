      supuestos:
        - 'Arquitectura: la receta pide un script con jq y date; por la regla de construcción se hace en Python 3 con solo la biblioteca estándar (referencias/statusline.py) y referencias/statusline.sh solo delega en él con exec python3.'
        - 'Arquitectura: forma del JSON de la consola supuesta: model.display_name (o model.id), workspace.project_dir / workspace.current_dir / cwd, context_window.used_percentage, rate_limits.five_hour y rate_limits.seven_day con used_percentage y resets_at.'
        - 'Vocabulario «modo de la IA»: el archivo local que anota qdd se lee de la variable CCC_MODO_ARCHIVO o, sin ella, de ~/.claude/qdd-modo; contiene el modo en texto plano o JSON {"modo": ...}; solo se muestran modos conocidos (default→normal, acceptEdits→acepta ediciones, plan, auto, bypassPermissions→sin permisos, dontAsk→no preguntar).'
        - 'Arquitectura: el ancho se lee de /dev/tty (equivalente a stty size); la variable CCC_ANCHO lo fija para pruebas y CCC_ANCHO vacío o 0 significa ancho desconocido.'
        - "CCC-C01: el relleno de toda línea con izquierda y derecha empieza con U+2800 seguido de espacios; la línea sin izquierda empieza también con U+2800; el ancho visible cuenta los emoji (\U0001F4C2) como 2 columnas."
        - 'CCC-C07: sin ancho, si no hay contexto la primera línea es solo «modelo · modo»; angosta, cada elemento de la derecha que no cabe junto a una izquierda baja a la línea siguiente y, sin izquierda, va solo alineado a la derecha.'
        - 'CCC-C03: epoch puede venir como número o texto, en segundos o milisegundos (> 1e12); una fecha ISO sin zona horaria se toma como UTC; la hora se muestra en la zona local.'
        - 'Invariantes: redondeo a entero de mitad hacia arriba (como round de jq), no el redondeo bancario de Python.'
        - 'Invariantes: un texto con forma de correo o credencial (sk-…, ghp_…, xox…-) no se muestra; se quitan caracteres de control del JSON.'
        - 'Vocabulario «segmento de recursos»: no está en los escenarios ni en la barra completa sugerida; se implementa opcional (CCC_RECURSOS=si), con disco de la carpeta del proyecto, GPU vía nvidia-smi (caché de 5 s, tope 300 ms), RAM de /proc/meminfo y CPU por diferencia de /proc/stat (la primera muestra no se muestra).'
        - 'CCC-C05: la compactación real la hace Claude Code; aquí se prueba que la configuración fija autoCompactWindow=400000 en modelSettings.opus y un modelo (consola.Conversacion) que compacta al llegar a la ventana, resume la tarea en curso y sigue sin nuevo pedido.'
        - 'Pasos: consola.configurar fusiona en ~/.claude/settings.json (model=opus, effortLevel=high, modelSettings.opus.autoCompactWindow, statusLine command → referencias/statusline.sh) y no reemplaza una statusLine propia salvo reemplazar_barra=True.'
        - 'Alcance: consola_qdd=no, así que no se construyen ''qdd consola activar'', el panel, sus acciones ni la aprobación de fichas.'
        - 'CCC-C06: la receta no trae el escenario CCC-C06; no se prueba.'
