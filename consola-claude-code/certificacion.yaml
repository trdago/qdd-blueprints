      supuestos:
        - 'Arquitectura: el script de barra (statusline.sh con jq y date) se hizo en Go (cmd/barra), sin jq'
        - 'Arquitectura: la CLI qdd se simula en proceso (paquete qdd); el panel la usa por una interfaz equivalente a ''panel --json'' y ''accion <id>'''
        - 'JSON de la consola: model.display_name/id, workspace.project_dir/current_dir, cwd, context_window.used_percentage y rate_limits.five_hour/seven_day con used_percentage y resets_at'
        - 'CCC-C03: un resets_at numérico mayor que 1e12 son milisegundos; un ISO sin zona se toma como UTC'
        - 'Barra: la hora de renovación va en la zona local del equipo'
        - 'Barra: entre izquierda y derecha va al menos una columna de relleno (U+2800 y luego espacios)'
        - 'barra minima: solo la 1.ª línea (modelo · modo y contexto), sin carpeta ni tramos; el segmento de recursos igual va como última línea'
        - 'CCC-C07: sin ancho, debajo van en orden la carpeta, 5h, semana y recursos'
        - 'Ancho de la terminal: ''stty size'' sobre /dev/tty; si falla, se trata como sin ancho'
        - 'CCC-C06: el modo lo anota un hook UserPromptSubmit (''qdd consola anotar'') en un modo.json local con su hora; un modo desconocido no se muestra'
        - 'Modo: default es normal, acceptEdits es acepta ediciones, plan, auto, bypassPermissions es sin permisos; una hora futura de más de 1 min se ignora'
        - 'estado.yaml: se lee y escribe en el subconjunto JSON de YAML (solo biblioteca estándar)'
        - 'Fichas: .qdd/modules/<id>.json con estado borrador o aprobada'
        - 'Pedidos, turno y modo: se guardan en la carpeta local de qdd, fuera del proyecto'
        - 'CCC-C24: la tarea sigue cambiando si cambió en un turno (mensaje de la persona) posterior al del pedido'
        - 'Pedidos: teclas a, b, d, e… sin las del panel (c l n o s u x); un pedido conserva su tecla mientras siga en la cola'
        - 'CCC-C19: «x  Descartar» es una acción aparte (descartar_pedido) que qdd ofrece con cada pedido; la x es el segundo paso'
        - 'CCC-C13: «4 de 9 tareas» son mostradas de pendientes; esperan y fallan cuentan tareas por su peor etapa'
        - 'Peor etapa: ❌ > ⏳ > pendiente > ✅; una tarea cuya peor etapa es pendiente va sin color'
        - 'Tarea terminada: estado terminada o todas sus etapas ✅; las más nuevas se ordenan por fecha de creación'
        - 'Panel: la cabecera usa la hora del panel al dibujar; «● running» alterna negrita y atenuado en cada lectura'
        - 'CCC-C27: el foco va primero, no se muestran objetivos sin tareas visibles, el prefijo es «└─ » por nivel de dependencia y se espera a la primera dependencia pendiente'
        - 'CCC-C22: el motivo del descarte es fijo («descartada desde el panel») porque el panel solo pasa ids'
        - 'Auditar: simulado como revisión del estado y las fichas que deja .qdd/audit/ultimo.json'
        - 'CCC-C20: el foco es un campo del panel; abrirse solo no lo cambia y /tareas sí'
        - 'CCC-C08: la instalación se simula con un marketplace local en la carpeta de qdd y una copia en <home>/.claude/plugins/qdd-tareas@qdd/plugin.json'
        - 'CCC-C08: barra propia es cualquier statusLine que no sea ''qdd consola statusline…'' ni la de la receta; ReemplazarBarra la cambia a pedido'
        - 'CCC-C09: doctor --fix vuelve a aplicar activar con las opciones que lee de la barra actual'
        - 'CCC-C23: OpenCode se detecta por <home>/.config/opencode; el panel es plugins/qdd-tareas.js en la lista plugin de tui.json; la API del plugin (sidebar.render) es supuesta'
        - 'CCC-C05: la autocompactación se simula con un resumen de 2000 tokens que conserva la tarea en curso'
        - 'CCC-C14: D por statfs, R por /proc/meminfo, C por /proc/stat, G por nvidia-smi y /sys/class/drm (gpu_busy_percent); CPU previa y caché de GPU en un archivo local'
        - 'CCC-C16: una consulta a nvidia-smi que pasa de 300 ms cuenta como consulta y deja la última lectura (o ninguna G)'
        - 'CCC-C25: el mensaje se acorta en este orden: lo citado, el nombre, la etapa y de quién (mínimo 8 caracteres cada uno)'
        - 'Pruebas: las carpetas temporales se crean dentro de cada paquete (.pruebas) y se borran al terminar'
