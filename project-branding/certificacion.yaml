      supuestos:
        - 'Paso 1 / invariante de la entrevista: no hay persona real; las respuestas las da una persona dueña FICTICIA en marca/entrevista.FICTICIA.json (marcado FICTICIA) y la aprobación registrada también es ficticia.'
        - 'Paso 2: los documentos de marca (plataforma, arquitectura de nombres, guía de voz) son JSON versionados en marca/ para poder validarlos; cada sección de la plataforma apunta a la respuesta (fuente) de la que sale.'
        - 'Proyecto ficticio: Molienda, suscripción de café de origen en México (web, app simulada y correos); dominio molienda.example.'
        - 'Invariante de lemas: «hasta 0 secundarios» se aplica literal: cualquier lema secundario hace fallar la validación.'
        - 'Paso 5: DTCG 2025.10 (color como objeto colorSpace/components/hex, dimension y duration como {value, unit}); rol, atributo y modos van en $extensions[''mx.molienda'']; $value repite el valor del modo claro porque es obligatorio.'
        - 'PB-C10: el atributo se exige a tokens semánticos y de componente (los primitivos son paleta); debe ser un valor o rasgo de la plataforma de marca.'
        - 'Rol semántico «sobre»: el texto es el rol sobre-fondo; cada rol de fondo (fondo, superficie, marca, error, exito) tiene su par sobre-*.'
        - 'PB-A01/A02: el ADN es la lista de patrones de plataforma.adn.tokens (toda la paleta, tipografía display, radio y componente del botón principal); los tokens de firma viven en tokens/plataformas/<plataforma>.json y solo pueden estar bajo semantico.firma.'
        - '«la guía» (pantallas clave, fondos para el color de marca como texto, degradaciones): como la receta solo define la guía de voz, se creó marca/guia.json (guía visual); los fondos permitidos para el color de marca como texto se declaran en la fuente de tokens (marcaComoTexto).'
        - 'PB-C14: pares usados = web: color y fondo de cada regla CSS (sin fondo propio, sobre color.fondo; bordes como elemento de interfaz); app: herencia del fondo en el árbol de vista; correo: pares registrados al renderizar.'
        - 'PB-C08: zona horaria America/Mexico_City; fecha larga, hora de 12 h («2:30 p.m.»), montos en MXN; Intl del sistema (ICU de Node) con datos CLDR.'
        - 'Tratamiento usted: detección heurística con una lista de formas de tuteo inequívocas; mayúsculas: solo se detecta el texto todo en mayúsculas.'
        - 'PB-C09: «dato inventado» y «jerga interna» se detectan con listas cerradas en marca/voz.json; el build de producción es el catálogo compartido/textos.json (única fuente de textos visibles).'
        - 'PB-E02: «nunca reemplaza una palabra» se vuelve una regla verificable: el emoji va al final, después de una oración completa.'
        - 'Fuentes tipográficas: los .woff2 y las licencias OFL en fuentes/ son marcadores SIMULADOS (sin red); se verifica ruta propia, existencia y licencia registrada. Familia de un estilo sin font-family = la del body.'
        - 'PB-C17: una «definición» de la firma es cada lugar del código que consume directamente su token (regla CSS o línea TS).'
        - 'Logo: el logotipo es <text> con su ancho declarado en el maestro (data-logotipo-ancho) porque no hay métricas de fuente; el raster no tiene antialiasing; el PNG para compartir no lleva texto rasterizado y el nombre se verifica en compartir.svg, og:title y og:image:alt.'
        - 'Monocromas: «mono-clara» = logo en color claro para fondos oscuros, «mono-oscura» = logo oscuro para fondos claros; la contraforma se recorta con máscara. La variante de modo oscuro usa los valores oscuros de los mismos tokens.'
        - 'PB-C21: ícono de tienda 1024×1024 RGB (criterio de App Store; Play pide 512 y no se generó); adaptativo de Android a 4x (432 px) con isotipo de 60 dp; íconos del manifest maskable con el isotipo al 60%.'
        - 'PB-C22: manifest con theme_color/background_color del modo claro (el manifest admite un solo valor); la página se pide a un manejador puro (sin servidor ni red).'
        - 'PB-C25: las capturas son SVG deterministas generados desde las fuentes (sin navegador); web y correo a 360 y 1280, app solo a 360; la revisión humana se representa con el campo revisadoPor del PR.'
        - 'PB-C26 / PB-M03: splash, app y selector simulados con funciones puras y dobles (almacén en memoria, preferencia del sistema).'
        - 'PB-C18: con movimiento reducido la animación conserva el fundido sin desplazamiento (o se omite si se pide).'
        - 'Correo: estilos en línea con los valores claros y bloque @media (prefers-color-scheme: dark) con los oscuros; la sombra se degrada al borde grueso declarado en la guía.'
        - 'Paso 12: la imagen de respaldo se genera desde el SVG maestro (isotipo sobre superficie) en marca/generado/respaldo.svg.'
      aprobada: true
