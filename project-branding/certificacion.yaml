      supuestos:
        - 'Paso 1/2 (PB-C01): la persona dueña es FICTICIA (marca/entrevista_FICTICIA.json, marcado FICTICIO). El agente escribió sus respuestas por encargo, lo que contradice la invariante «ninguna respuesta la escribe el agente»; la trazabilidad se verifica contra ese archivo.'
        - 'Paso 1: la receta no lista las preguntas de la entrevista; se derivaron del vocabulario «plataforma de marca» (incluye antirreferentes, que el Paso 1 y la invariante no nombran) y se agregaron lemas secundarios y arquitectura de nombres.'
        - 'Paso 2: la «aprobación» se registra como quién (aprobada_por) y cuándo (fecha ISO) dentro de plataforma.json, con referencia a la respuesta de aprobación en la entrevista.'
        - 'Documentos versionados: la plataforma, la arquitectura de nombres y la guía de voz son JSON (marca/*.json) para poder validarlos sin dependencias; no hay versión .md.'
        - 'Paso 3 (PB-C03): «nombre de paquete» se detecta con un patrón (a.b.c o palabras_con_guion_bajo) y el identificador técnico declarado.'
        - 'PB-C03: la imagen para compartir se comprueba en su fuente og.svg; el PNG no lleva el nombre porque la biblioteca estándar no puede rasterizar texto con una fuente.'
        - 'Paso 4 / PB-C08: Python estándar no trae datos CLDR y el locale es_CL del sistema no está garantizado; se usa una copia parcial a mano de datos CLDR es-CL en pb/cldr_es_CL.json (no verificable sin red). Formatos elegidos: fecha media dd-MM-y, larga d ''de'' MMMM ''de'' y, hora HH:mm, CLP sin decimales con ''.'' de miles.'
        - 'Paso 4: el tratamiento «tú» se prueba con una lista de formas prohibidas (usted, vosotros, podéis...), no con análisis gramatical.'
        - 'PB-C09: «dato inventado» y «jerga interna» se detectan con listas cerradas en la guía de voz; el «build de producción» se simula renderizando web, app, correos y notificaciones con una reserva de muestra.'
        - 'Paso 5: DTCG en su borrador con colores hex y dimensiones como texto (''4px''); los modos van en $extensions[''pb.marca''].modos además de $value (iguales en el único modo). Rol, atributo, clase y pares también viven en $extensions.'
        - 'Paso 5 / PB-C10: el atributo de cada token debe ser un valor o un rasgo de personalidad («es») de la plataforma. Los tokens de componente no llevan rol/atributo propio: heredan los del semántico al que apuntan.'
        - 'Rol semántico: solo los roles de clase «fondo» exigen su par «sobre-»; borde-campo (interfaz) y sombra (decorativo) no.'
        - 'Paso 6 / PB-C11: los temas generados solo exponen tokens semánticos y de componente; la prueba busca referencias a nombres «primitivo» en el código de plataformas/.'
        - 'PB-C13: «código de una plataforma» = plataformas/** (.css, .html, .py). Los pesos tipográficos literales se permiten (la receta no los lista); los px de márgenes también.'
        - 'Paso 7 / PB-C14: los pares usados se extraen de reglas CSS (una regla sin fondo usa el fondo por defecto de la guía), estilos en línea de las páginas renderizadas, árboles de widgets de la app y correos renderizados en «modo roles». El anidamiento CSS entre clases no se analiza.'
        - 'PB-X02: «texto grande» no está definido en la receta; se asume la definición WCAG y todos los pares se declaran como texto normal o interfaz. El borde de campo se mide contra su fondo y contra el fondo que lo rodea.'
        - 'Paso 8: no se pueden empaquetar archivos de fuentes reales sin red; la carga (rutas propias y licencia OFL) queda declarada en los tokens y en @font-face, sin los .woff2.'
        - 'Paso 9 / PB-C17: «definición de la firma» = cada lugar de plataformas/ que lee el token de firma (regla CSS con --firma-*, función Python que lee FIRMA_* o ''firma.*'', plantilla con {{firma.*}}).'
        - 'PB-U01 vs degradación en correo: el tema del correo guarda el mismo valor de token; la degradación (borde en vez de clip-path y sombra) se aplica al renderizar y está declarada en la guía.'
        - 'Paso 10: el rasterizado (íconos, og.png, capturas) es un rasterizador propio sin antialiasing. «Monocroma clara» = tinta clara (sobre-marca) para fondos oscuros; «oscura» = tinta oscura (sobre-fondo).'
        - 'Paso 10: el logotipo es texto SVG con la familia de display; no se convierte a trazos. El correo referencia el SVG horizontal por URL porque no se puede generar un PNG con texto.'
        - 'PB-C21: el ícono adaptativo se genera a 432 px (108 dp × 4) con un isotipo de 60 dp; la zona segura es el círculo de 66 dp.'
        - 'PB-C22: la página se pide a la app WSGI en memoria (sin red ni servidor).'
        - 'PB-C24: el «fallo al cargar» en el navegador se simula con un doble que aplica el onerror; el logo de la cabecera no se trata como imagen de contenido.'
        - 'Paso 13 / PB-C25: las capturas son PNG deterministas simulados (sin navegador) dibujados con tokens y logo; no muestran texto. El PR se representa con un dict (archivos cambiados y revisiones); la revisión humana se exige como una aprobación registrada.'
        - 'PB-C25: el correo tiene ancho de escritorio (1440) y la app solo celular (390).'
        - 'PB-C26: con un solo modo de marca (claro), si el sistema pide oscuro la app y el splash siguen en claro; «en el modo de color del sistema» se interpreta como «el modo del sistema no rompe la igualdad».'
