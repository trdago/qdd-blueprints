      supuestos:
        - 'Arquitectura: no hay referencias/fases.yaml en la carpeta; las 14 fases (artefacto, señales, puerta, dependencias, analogía, concepto y término) viven en src/fases.js y se escriben en .qdd/project/tutor/plan.yaml al aplicar.'
        - 'Formato: plan.yaml, bitacora.yaml y los manifiestos se escriben en un subconjunto de YAML con escalares JSON (YAML 1.2 válido), con un lector propio, para no depender de bibliotecas externas.'
        - 'registro → archivo: no se escribe estado.yaml; el estado y el nivel de cada fase viven solo en plan.yaml (registro: tabla sí escribe estado.yaml).'
        - 'Corridas: la receta deja dónde viven al proyecto; el tutor las recibe como objeto o ruta a un JSON, y el diagnóstico las busca en los .json del repositorio que tengan fase (Fxx) y métricas. Una corrida válida trae id, fecha, fase, version_datos, version_golden si la fase usa golden (F06, F09, F10, F11, F14), semilla si declara aleatoria: true, y metricas.'
        - 'Puertas: cada fase lee nombres de métrica fijos de la corrida (p. ej. F04 kappa, n_ejemplos, desacuerdos_sin_regla, desacuerdos; F05 fugas, sha256_conjunto, revisores, clases_faltantes; F14 regresion_pasada, tablero_activo, alertas_activas, rollback_probado); un campo ausente deja la puerta ⏳ con lo que falta y uno en false la deja ❌.'
        - 'Puertas documentales (F01, F02, F07, F13): la corrida del script del proyecto trae metricas.valido (true/false) e incumplidos; src/validadores.js ofrece validarProblemaMd para F01 (incluye por qué el corpus no tiene datos personales).'
        - 'KPI: lo decide una persona en la decisión de F01 (hacer con kpi: metrica, direccion mayor|menor, meta, error_tolerado) y queda en plan.yaml.'
        - 'Persona: cualquier identificador no vacío distinto de «tutor»; las aprobaciones, el «—» y relajar una puerta exigen una persona.'
        - 'Avance: una fase tiene avance si su Artefacto, su Medición o su Puerta está en ✅; solo esas se reabren en cascada.'
        - 'Fuga (CVA-C06): al medir F05 con una corrida que trae fugas, F05 pasa a ❌ y se reabren sus dependientes con avance; otras puertas que pasan a ❌ no reabren dependientes.'
        - Una medición nueva sobre una fase con Puerta ✅ o ❌ la devuelve a ⏳ hasta evaluarla otra vez (la ✅ queda atada a la corrida aprobada).
        - 'Nivel durante el ciclo: Artefacto ✅ sube a 2, una corrida que cumple la puerta con artefacto sube a 3 (4 si la corrida declara automatica y alertas); una reapertura lo baja a 2 como máximo.'
        - 'Nivel 4 en el diagnóstico: la corrida que cumple la puerta declara automatica: true y alertas: true.'
        - 'Diagnóstico: obligatorio antes del ciclo en cualquier fase (punto de entrada cierre); se detectan señales por nombres de archivo, carpetas y expresiones en el contenido; un reporte de métricas en un notebook sin corrida cuenta como nivel 2 no reproducible.'
        - 'Entrevista: se pasa como objeto por fase (existe true → nivel 1 hasta que haya artefacto, false → 0 confirmado, otra cosa → «?»).'
        - 'Diagnósticos repetidos: no bajan etapas ni puertas ya ganadas en el ciclo; cada diagnóstico queda en .qdd/project/tutor/diagnosticos/diagnostico-NNN.yaml y .md.'
        - 'Impacto de una brecha: las fases que bloquea; esfuerzo de una fase «?» queda sin número (no entra al plan).'
        - Las 3 brechas de mayor riesgo se toman solo de fases bajo nivel 3 con nivel conocido; empate por orden de fase.
        - 'Ubicación de artefactos: rutas relativas a la raíz del proyecto; F08 usa entrenamiento.md y F09 evaluacion_v1.md por defecto. Las plantillas vacías del modo tutor van en .qdd/project/tutor/plantillas/.'
        - 'Comprensión en modo juego: una pregunta de opción múltiple por fase; acertar da 10 XP y el logro «Robot Archivador · <fase>»; el puntaje vive aparte en puntaje.yaml.'
        - 'Secretos y PII: se quitan las claves con nombre de secreto (credencial, token, api_key, password…) y se redactan correos, RUT (con puntos o tras «RUT»), teléfonos chilenos y tokens con prefijos conocidos; los ejemplos se citan por ruta y sha256.'
        - 'Contrato de estado: subconjunto de JSON Schema (type, required, properties, items, enum, additionalProperties) con un contrato común y uno opcional de entrada/salida por agente; la corrida de punta a punta la hace correrPuntaAPunta, para que la usen los scripts del proyecto.'
        - 'Drift: el error del umbral de F10 se toma del punto elegido; el límite es ese error + drift_margen (0.05) y se redondea para evitar errores de coma flotante.'
        - 'Generación: si la corrida de F09 dice juez: llm, exige kappa_juez ≥ 0.7; la rúbrica revisada por personas la entrega el proyecto como métrica del KPI.'
        - Archivos temporales de las pruebas en ./tmp, que se borran al terminar.
      aprobada: true
