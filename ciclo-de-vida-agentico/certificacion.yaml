      supuestos:
        - 'Arquitectura: plan.yaml, estado.yaml, bitacora.yaml y golden.manifest.yaml se escriben en JSON (subconjunto válido de YAML 1.2) para usar solo la biblioteca estándar; un estado.yaml previo en YAML no JSON no se puede leer.'
        - 'Arquitectura: referencias/fases.yaml no venía en la carpeta; las 14 fases y el texto del tutor (concepto, para qué, cómo se mide, término de la industria, preguntas) están en cva/fases.py, escritos por mí.'
        - 'Paso 2 / CVA-R01: la tabla de estado-por-tareas es mínima: estado.yaml con ciclos.agentico, un objetivo «Ciclo de vida agéntico» con ciclo agentico y una tarea por fase con celdas {estado, falta, requiere_aprobacion, aprobado_por, motivo}; la clave ''etapas'' del proyecto y sus otras tareas no se tocan. No existe el comando qdd: se reemplaza por la API Tutor.aplicar.'
        - 'Paso 3: «marcar» evalúa la puerta con la última corrida y, si se cumple, la deja en ⏳ esperando a una persona; «aprobar» es un paso aparte que solo una persona (quien distinto de ''tutor'') puede dar.'
        - 'Paso 3 / Concepto: con comprension=preguntas el Concepto pasa a ✅ solo con una comprobación entendida; si no se entendió, el tutor vuelve a explicar (nueva entrada de explicación).'
        - 'Paso 5: las métricas de cada puerta se leen de claves fijas en corrida.metricas (p. ej. F04 kappa/n_doble/desacuerdos_sin_regla/pares_desacuerdo, F14 regresion_pasada/tablero_activo/alertas_activas/rollback_probado); una clave ausente deja la puerta en ⏳ con lo que falta, una clave que no cumple la deja en ❌.'
        - 'Paso 5: las puertas documentales (F01, F02, F07, F13) se cumplen si la corrida del script de validación trae valida=true y sin faltantes; se incluye un validador de ejemplo para problema.md (cva/validadores.py) con líneas «KPI:», «Dirección:», «Meta:», «Error tolerado:», «Fuera de alcance:».'
        - 'Paso 5: aprobar exige además las dependencias en ✅ o «—»; una aprobación rechazada deja su entrada de puerta en la bitácora sin cambiar el estado.'
        - 'Paso 5: una corrida nueva válida devuelve la Puerta a ⏳ si estaba en ❌ o ✅ (hay que evaluarla y aprobarla de nuevo).'
        - 'Paso 5 / C06: la fuga del golden pone F05 en ❌ aunque su artefacto no esté registrado (invariante del golden).'
        - 'Paso 6: la limpieza de PII de F03 es un sub-estado propio (limpieza_pii) con su corrida (metricas.pii_restante == 0) y su aprobación por una persona; es requisito para abrir F04 y para aprobar F03 cuando datos_personales=si.'
        - 'Paso 7: el golden vigente lo fija congelar_golden o, si no hay, la primera corrida medida de F05; una versión congelada con otro contenido se rechaza (se versiona).'
        - 'Paso 7: el baseline de F09 es la última corrida de F06; si su versión del golden difiere de la de F09 la comparación se rechaza y la puerta queda ⏳ (no ❌), porque no es una corrida que muestre que no se cumple.'
        - 'Paso 9: escribir_umbral genera umbral.md desde la corrida de F10; el punto se elige con elegir_umbral (error ≤ tolerado, mayor cobertura, empate al umbral más alto).'
        - 'Paso 10: reabrir baja el nivel de la fase reabierta a como mucho 1 y el de las dependientes a como mucho 2; la reabierta conserva su Concepto.'
        - 'Paso 10: «fase con avance» = al menos una etapa en ✅.'
        - 'Paso 11: el contrato de estado usa un subconjunto de JSON Schema (type, required, properties, enum, minimum, maximum, items) validado por cva/agentes.py; la métrica por agente es la tasa de aciertos de una función que da cada agente.'
        - 'Paso 12: convención de salidas.md supuesta: <carpeta>/<elemento>.salida.json con la metadata dentro; bajo el umbral, revision_humana.requerida=true.'
        - 'Paso 13: drift si tasa de correcciones > error del punto elegido en F10 + 0.02 (estrictamente mayor); se registra como medición de F14 en la bitácora y reabre F03 con cascada.'
        - 'Paso 14: la bitácora quita claves secretas (credencial, token, password, api_key…), cambia contenido/texto de ejemplos por su sha256 y redacta correos, RUT, teléfonos chilenos y tokens con regex; un id de corrida con forma de RUT (8 dígitos-guion-dígito) también se redactaría.'
        - 'Paso 14 / C18: la coherencia se verifica reproduciendo los cambios de etapa de la bitácora y comparándolos con plan.yaml y estado.yaml, además del conteo de reaperturas y que cada Puerta ✅ tenga una aprobación de persona.'
        - 'CVA-R01 / diagnóstico: nivel 1 por señales de nombre de archivo o carpeta, 2 si está el artefacto, 3 si además hay una corrida en corridas/*.json que cumple la puerta, «?» si no se pudo leer; el nivel 4 no se diagnostica; Artefacto y Medición pasan a ✅ según el nivel y la Puerta queda ⏳; «mejorar primero» es la primera fase en orden con nivel < 2.'
        - 'Ajuste de puertas: los parámetros endurecibles son F04 kappa_min/n_min, F05 revisores_min y F14 margen_drift; relajar exige persona y porqué.'
        - 'Pruebas: los proyectos temporales se crean en ./tmp y se borran al terminar; la persona de las pruebas es ''ana''.'
