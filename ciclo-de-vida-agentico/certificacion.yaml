      supuestos:
        - 'General: Node no trae YAML; escribí un subconjunto propio (src/yaml.js: mapas y listas en bloque, cadenas entre comillas dobles, números, booleanos, null) para plan.yaml, bitacora.yaml, puntaje.yaml, los diagnósticos y referencias/fases.yaml.'
        - 'Arquitectura: referencias/fases.yaml no venía en la carpeta; lo escribí yo con las 14 fases (artefacto, señales, puerta, dependencias), más el concepto, la analogía para nivel inicial, el término de la industria, una pregunta de opción múltiple por fase y los patrones (regex de ruta/contenido) con que el diagnóstico busca señales.'
        - 'registro → archivo: no se escribe estado.yaml; el estado y el nivel viven solo en .qdd/project/tutor/plan.yaml.'
        - 'Arquitectura: ubiqué todo lo del tutor en .qdd/project/tutor/ (plan.yaml, bitacora.yaml, diagnostico.md, diagnosticos/NNNN.yaml con cada diagnóstico guardado, puntaje.yaml y plantillas/); los artefactos de las fases van donde la persona diga dentro del proyecto.'
        - 'entrada → cierre: «acompaña solo si se lo piden» lo interpreté como que el ciclo del tutor exige, además de diagnostico.md, un pedido de acompañamiento firmado por una persona (pedirAcompanamiento); esa entrada usa fase «todas».'
        - 'Corridas: la receta deja formato y lugar al proyecto; las leo como objetos (en el diagnóstico, cualquier .json del repositorio con fase FNN y metricas). Exijo versión del golden en F05, F06, F09, F11 y F14 o si la corrida declara usa_golden, y semilla solo si declara azar: true.'
        - 'Puertas: traduje cada puerta a claves que la corrida debe traer en metricas (p. ej. F04 kappa, n_ambos, desacuerdos_sin_regla; F14 regresion_pasada, tablero_activo, alertas_activas, rollback_probado). Clave ausente → ⏳ con lo que falta; presente y no cumple → ❌. En las puertas documentales (F01, F02, F07, F13) el script del proyecto informa valida: true/false.'
        - 'F01 con datos_personales → no: la corrida que valida problema.md debe traer sin_datos_personales_explicado: true.'
        - 'F06: «versión vigente del golden» es la version_golden de la última corrida medida de F05.'
        - 'F09: cumplir el KPI es inclusivo (≥ meta si es mejor más alta, ≤ si más baja); superar al baseline es estricto, como dice la receta. Comparar golden distintos deja la puerta en ⏳ pidiendo medir los dos sobre la misma versión (no en ❌).'
        - 'F10: para tener «la cobertura, el error y el ECE antes y después de calibrar» pedí dos curvas en la corrida (curva_antes sin calibrar y curva calibrada) y apliqué la misma regla a cada una; el umbral adoptado sale de la curva calibrada.'
        - 'Orden del ciclo: hacer y medir exigen haber explicado; marcar exige medición y artefacto. No exijo artefacto antes de medir porque umbral.md y evaluacion_vN.md contienen resultados de la medición.'
        - 'Paso 10 frente al invariante del Paso 5: el tutor redacta umbral.md solo si la persona lo intentó o pidió ayuda.'
        - 'Concepto: con comprension → juego siempre se comprueba; «se entendió» es acertar todas las preguntas de la fase; si no, Concepto queda ⏳ con «volver a explicar» y hay que explicar de nuevo antes de otra comprobación.'
        - 'Juego: 10 XP por acierto y el logro «Robot Archivador de FNN» al acertar todo; el puntaje vive en puntaje.yaml, aparte del plan.'
        - 'nivel: la variante solo define «inicial»; los textos de «aprendiz» y «experto» que pide CVA-C16 los inventé yo (concepto más término; término más concepto).'
        - «Con avance» lo definí como tener Artefacto, Medición o Puerta en ✅ (Concepto no cuenta).
        - 'Fuga: el tutor no compara hashes; lee metricas.fugas de una corrida de F05 (golden.buscarFugas es la herramienta para el script del proyecto). Al medirla, F05 pasa a ❌ en el acto y las fases con avance que dependen de F05 vuelven a ⏳ con su reapertura, aunque la regla de propagación de la receta habla de reabrir, no de ❌.'
        - Un ❌ en otras fases (p. ej. F09) no hace volver a ⏳ a sus dependientes; solo propagan la reapertura, la fuga y el drift.
        - Una corrida nueva devuelve la Puerta a ⏳ aunque estuviera en ✅, porque la aprobación era de otra corrida; la receta solo lo dice para una puerta en ❌.
        - La aprobación exige que la evaluación «cumple» sea de la corrida vigente. Si una dependencia no está en ✅ o «—», queda una entrada de puerta con resultado «bloqueada» que nombra lo que falta, sin cambiar el estado.
        - Pedir marcar sin una medición válida no deja entrada (así la marca siempre va después de medir); devuelve qué corrida falta. Una métrica escrita a mano deja una entrada de medición «rechazada» sin efectos.
        - Reabrir devuelve a ⏳ también el Artefacto aunque el archivo no cambie, así que hay que registrarlo de nuevo.
        - 'Diagnóstico, nivel 1: señales por regex o la entrevista dice que existe. Nivel 2: hay artefacto o se encontró una métrica (aunque no se pueda reproducir). Nivel 3: artefacto más una corrida reproducible en que la puerta se cumple. Nivel 4: lo mismo con una corrida que declara automatica: true y alerta: true. Nivel 0: la entrevista dice no_existe y no hay evidencia. Si no, «?». La detección de señales es heurística.'
        - 'Diagnóstico: para el riesgo cuento las dependientes transitivas; la receta no define «impacto», así que lo informo como la lista de esas fases. Esfuerzo = 3 − nivel; no se calcula para «?».'
        - 'Diagnóstico: las 3 brechas de mayor riesgo salen solo de fases con nivel numérico bajo 3, con empate por orden de fase; las fases en nivel 3 tienen brecha (llegar a 4) pero no entran a ese ranking.'
        - 'Diagnóstico: el plan es un orden topológico con prioridad riesgo ÷ esfuerzo, usando dependencias transitivas entre las fases del plan.'
        - 'Diagnóstico: una fase en «—» sale con «—» en el semáforo (la receta no le da color) y sin brechas.'
        - 'Diagnóstico repetido: solo sube Artefacto o Medición si estaban en ⏳; nunca las baja ni toca Puerta o Concepto. Con nivel 3 o más deja la evaluación «cumple» con esa corrida, para que la persona pueda aprobar. El nivel solo cambia con un diagnóstico; el ciclo no lo recalcula.'
        - 'Diagnóstico: deja una entrada de tipo diagnóstico por fase.'
        - 'Diagnóstico: cada brecha nombra su riesgo y cada fase trae una recomendación (texto según el nivel); el énfasis de cierre en F05, F10 y F14 queda como sección aparte.'
        - 'Bitácora: cada entrada lleva sus efectos sobre las etapas y el nivel. «Coherente» significa que al reproducir los efectos se obtiene plan.yaml y que cada ✅, ❌, «—» y reapertura tiene su entrada. Una corrección es del mismo tipo que la entrada corregida y la cita (la lista de tipos no tiene «corrección»).'
        - 'Secretos y PII: la bitácora guarda solo campos de una lista blanca, cita las corridas por id y los ejemplos por ruta y sha256, y rechaza textos con credenciales (sk-, ghp_, AKIA, password=), correos, RUT o teléfonos +56. Un nombre propio no se detecta por patrón: se protege porque el contenido de un ejemplo nunca se copia.'
        - 'Contrato de estado: un subconjunto propio de JSON Schema (type, required, properties, additionalProperties, items, enum, minimum, maximum); el orquestador es una función (estado, paso) que devuelve el nombre de un agente o null.'
        - 'Trazabilidad: la metadata va en <nombre>.meta.yaml junto a <nombre>.txt; la convención de nombres por defecto es [a-z0-9_-]. Toda salida exige versión de checkpoint aunque no se entrene (p. ej. «no-aplica-few-shot»).'
        - 'Drift: es drift si la tasa es estrictamente mayor que el error del punto elegido en F10 + 0.05 (no el error tolerado); ese punto se fija cuando se marca F10, sin esperar su aprobación. La medición de drift no cambia las etapas de F14; F14 vuelve a ⏳ solo si tenía avance (por depender de F03).'
        - 'Endurecer o relajar: solo la puerta de F04 tiene parámetros (κ mínimo y n mínimo); relajarla pide una persona y un porqué.'
        - 'tipo_tarea → generacion: el KPI usa una métrica de rúbrica; si la corrida dice juez: llm, se exige metricas.kappa_juez ≥ 0.7 (si falta, ⏳; si es menor, ❌).'
        - 'Golden: el sha256 del conjunto es el sha256 de los sha256 de los ejemplos, ordenados y unidos con saltos de línea; todas las versiones van en un solo golden.manifest.yaml y congelar de nuevo una versión con otro contenido se rechaza.'
        - 'Pruebas: cada una crea su proyecto temporal en .tmp/ dentro de esta carpeta y lo borra al terminar.'
      aprobada: true
