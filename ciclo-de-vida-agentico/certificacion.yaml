      supuestos:
        - 'Arquitectura (YAML): sin dependencias externas no hay parser YAML; plan.yaml, estado.yaml, bitacora.yaml y golden.manifest.yaml se escriben como JSON indentado, que es YAML 1.2 válido. Las pruebas los leen con encoding/json.'
        - 'Arquitectura (referencias/fases.yaml): la receta dice que ese archivo trae las 14 fases con el texto que explica el tutor, pero no está en la carpeta. Escribí yo los textos (concepto, para qué sirve, cómo se mide, término de la industria y preguntas de comprensión) en fases.go y no genero ese archivo.'
        - 'Arquitectura (bitácora): la receta no dice dónde vive bitacora.yaml; la puse en .qdd/project/tutor/bitacora.yaml, junto a plan.yaml.'
        - 'Paso 2 (estado.yaml): el formato de la tabla de estado-por-tareas es de otro blueprint y no se describe; definí {tareas: [{id, titulo, estado, nivel, Concepto, Artefacto, Medición, Puerta, limpieza_pii, motivo, reaperturas}]}, con cada etapa como celda {estado, nota, faltan, no_cumple, corrida, aprobada_por}.'
        - 'Arquitectura (plan y estado): plan.yaml y estado.yaml repiten estado y nivel; se recalculan juntos tras cada evento y Coinciden() comprueba que digan lo mismo.'
        - 'Corridas: la receta deja dónde viven y su formato al proyecto. El tutor las lee de una interfaz FuenteCorridas (en las pruebas, una fuente en memoria en que una corrida guardada no se reescribe). Una corrida sin id, fecha, fase, versión de datos o métricas no se acepta.'
        - 'Puertas (nombres de métricas): la receta no fija qué métricas trae cada corrida. Inventé los nombres que lee cada puerta: incumplimientos (validadores documentales), grupos_compartidos, pii_restante, kappa, ejemplos_doble, desacuerdos_sin_regla, revisores, clases_faltantes, fugas, mejor_epoca, early_stopping, punta_a_punta, pasos_validados, pasos_invalidos, precision_relaciones, recall_relaciones, ece_antes, ece_despues, regresion_ok, tablero_activo, alertas_activas, rollback_probado y tasa_correcciones, más un Detalle estructurado (curva, pares en desacuerdo, métricas por agente, seleccion_por, hash del test, sha256 fugados, análisis de errores).'
        - 'F01, F02, F07 y F13 (puertas documentales): la corrida del script validador cumple si incumplimientos = 0; sus incumplimientos textuales pasan a la celda como lo que no se cumple.'
        - 'F01 (KPI): además de problema.md, el KPI (métrica, dirección mayor/menor, meta, error tolerado, fuera de alcance) se registra estructurado en plan.yaml con DefinirKPI, porque F06, F09 y F10 lo necesitan y el tutor no interpreta Markdown. El error tolerado es una tasa entre 0 y 1.'
        - 'Paso 3 (orden del ciclo): hacer exige una explicación previa de la fase, medir exige el Artefacto en ✅ y marcar exige la Medición en ✅. La comprobación de comprensión va entre explicar y hacer, pero hacer no exige el Concepto en ✅ (solo que se haya explicado).'
        - 'Paso 3 y CVA-C04 (marcar frente a aprobar): marcar lo hace el tutor y deja la Puerta en ⏳ con cumple=true y una entrada de tipo puerta; aprobar es una segunda entrada de tipo puerta, firmada por una persona, que deja la aprobación escrita en la celda.'
        - 'Paso 5 y CVA-C19 (aprobación con dependencias pendientes): la aprobación se rechaza con un error que nombra la dependencia que falta y no queda guardada; la persona vuelve a aprobar cuando la dependencia esté en ✅ o «—». La receta no dice si una aprobación prematura se conserva.'
        - 'Paso 5 (Concepto): la lista del paso 5 no menciona el Concepto, así que aprobar la Puerta no lo exige; aun así la fase solo queda en ✅ con las 4 etapas en ✅.'
        - 'Reapertura (con avance): tiene avance una fase con al menos una de sus 4 etapas en ✅. La cascada recorre todo el grafo de dependencias de forma transitiva, también a través de fases en ❌ o «—», que no cambian.'
        - 'CVA-C06 (fuga): F05 no se reabre; su Puerta pasa a ❌ (el Artefacto sigue en ✅) y sus dependientes con avance reciben entradas de reapertura que citan la fuga por sha256 y ruta. La fuga la detecta una corrida de F05 con fugas > 0 (BuscarFuga es la ayuda para el script del proyecto).'
        - 'CVA-C15 (drift): supera es estrictamente mayor (con tolerancia 1e-9 por la coma flotante); el error de F10 es el del punto elegido en la curva, no el error tolerado del KPI. El drift queda como medición de F14 en la bitácora, pero no reemplaza la corrida de la celda Medición de F14.'
        - 'CVA-C15 y Paso 6 (drift y PII): al reabrir F03 también vuelve a ⏳ su limpieza de PII, porque los ejemplos nuevos deben anonimizarse antes de anotar; por eso F04 no se puede volver a trabajar hasta una limpieza nueva. La receta no lo dice.'
        - 'Paso 6: sin la limpieza de PII de F03 en ✅, F04 no se abre, no se explica, no se hace, no se mide y no se aprueba; la receta solo habla de abrir. La limpieza se aprueba con una corrida con pii_restante = 0 y la firma de una persona, y la puerta de F03 la exige antes que el resto.'
        - 'Paso 9 y CVA-C09 (umbral): el sistema decide solo si confianza ≥ umbral. La regla error ≤ tolerado incluye el igual. umbral.md lo escribe el tutor (modo copiloto: propone) desde la curva y el ECE de la corrida, y se registra como el hacer de F10. A quién escala es un rol o usuario del equipo, sin PII.'
        - 'Nivel de madurez: los niveles son acumulativos (el 3 exige además el artefacto, y el 4 además que se mida solo). Una fase en «—» tiene nivel «—», que la receta no define. Al reabrir, el nivel baja según lo que queda en pie.'
        - 'Diagnóstico: el tutor recibe la evidencia encontrada (señales, artefactos, id de corrida, si se controla sola, si no se pudo comprobar) en vez de escanear el repositorio. Solo lectura significa que no toca los archivos del proyecto; sí escribe plan.yaml, estado.yaml y bitacora.yaml. Si una corrida existente muestra que la puerta no se cumple, la Puerta queda en ❌. Para calcular el nivel 3 se omiten las aprobaciones humanas internas del ciclo (la limpieza de PII de F03 y a quién escala en F10).'
        - 'Diagnóstico (brechas): el riesgo, el impacto y el esfuerzo son una heurística mía (el impacto se cuenta por las fases dependientes). Qué mejorar primero es la brecha bajo nivel 3 que más fases desbloquea; si empatan, la de la fase más temprana.'
        - 'Paso 14 y CVA-C17 (PII y secretos): se detectan por patrón (correos, RUT, teléfonos con +código, credenciales tipo api_key=, sk-, AKIA, ghp_, Bearer). Nombres y direcciones no se pueden detectar por patrón, así que se evitan por construcción: el tutor nunca copia el contenido de un ejemplo ni los parámetros de una corrida, solo cita por ruta y sha256. Una entrada con un dato sensible detectado se rechaza entera, no se redacta.'
        - 'Bitácora (quién): es el usuario del equipo o «tutor»; un correo como usuario se rechaza por ser PII. Las versiones de datos, golden, checkpoint y prompt que todavía no existen se registran como «ninguna».'
        - 'Bitácora y estado: cada entrada guarda estado_fase (el estado de la fase después del evento). VerificarCoherencia compara la última entrada de cada fase con el estado y exige una aprobación por persona para cada ✅, un no_cumple para cada ❌, una decisión no_aplica para cada «—» y que cada reapertura figure en los dos.'
        - 'Golden: el sha256 del conjunto es el sha256 de los sha256 de los ejemplos, ordenados y unidos por saltos de línea. Cada versión se guarda en golden/<versión>/golden.manifest.yaml. Congelar una versión nueva la vuelve vigente pero no reabre F06 ni F09 medidas sobre la anterior.'
        - 'CVA-C07: comparar corridas sobre versiones distintas del golden deja la Puerta de F09 en ⏳ con «medir sobre la misma versión» (falta una corrida válida) y no en ❌, por la regla de que ❌ es solo para una puerta que una corrida muestra que no se cumple.'
        - 'F04: menos de 50 ejemplos anotados por ambos o desacuerdos sin regla en la guía también dan ❌. La propuesta para mejorar la guía toma los 3 pares con más desacuerdos de la corrida.'
        - 'F08: reproducible quiere decir que la corrida trae su semilla; la época debe elegirse por loss_validacion, y si se eligió por test o golden la puerta queda en ❌.'
        - 'F11 y F12 (CVA-C12): implementé un orquestador secuencial mínimo y un contrato de campos tipados (string, number, bool, list, map). La métrica propia de cada agente es su acierto en el campo que produce, frente a lo esperado en el golden. La receta deja fuera elegir el framework de agentes, pero el escenario necesita algo que correr.'
        - 'F13 y CVA-C13 (salidas): la convención de nombres la decide salidas.md, que la receta no describe; usé <id>.json con el resultado y <id>.meta.json con la metadata, con ids [a-z0-9_-]. Una salida bajo el umbral no se entrega hasta que una persona la revisa.'
        - 'Producción (invariante): PuedeIrAProduccion exige F09 en ✅ y una corrida de F14 con la regresión pasada sobre el golden vigente.'
        - 'Paso 4 y CVA-C16: los niveles inicial, aprendiz y experto cambian solo el texto; las puertas no leen el nivel ni el modo. Solo hay un modo (copiloto).'
        - Volver a medir una fase ya aprobada con otra corrida deja la Puerta en ✅ hasta que se vuelva a marcar; volver a medir una Puerta en ❌ la devuelve a ⏳.
        - 'Endurecer o relajar una puerta: lo implementé para kappa_min, ejemplos_doble_min, revisores_golden_min y margen_drift. Endurecer lo puede registrar el tutor; relajar exige una persona y su motivo.'
        - 'Punto de entrada: inicio deja las 14 fases en ⏳ y nivel 0. En curso y cierre aplican lo mismo y después se llama a Diagnosticar; cierre no tiene un comportamiento propio porque la receta no lo describe.'
