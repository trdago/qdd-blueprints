      supuestos:
        - 'Paso 1 / Paso 3: «Vigía de facturas» va como nombre del dispositivo (DeviceProps.Os, plataforma Chrome) y «Chrome (Linux)» como nombre del cliente en PairPhone; la receta da dos nombres y no dice cuál ve el teléfono.'
        - 'Paso 3: un error de la petición del código (PairPhone) cuenta como «rechazo»; los eventos de passkey u otros desconocidos del canal cuentan como «estado inesperado».'
        - 'WAW-V03: «el tiempo agotado dice cuánto había» se interpreta como la validez del código (unos 2 min) y el tiempo transcurrido desde que se pidió; el mensaje trae ambos.'
        - 'E.164: la receta solo da la regla de Perú; sin «+» se exige que el número ya traiga el código de país (10 a 15 dígitos); se aceptan espacios, guiones, puntos, paréntesis y el prefijo 00.'
        - 'Lista blanca: un modo vacío es «completo»; uno desconocido se toma como «solo documentos» (el más restrictivo); ante teléfonos repetidos gana el primero.'
        - 'Trivial: «muy corto» es menos de 4 caracteres tras quitar espacios y signos; además vacío, solo emojis o fórmulas fijas (ok, gracias, listo, dale…).'
        - 'Paso 13: el prefijo «ia» se reconoce sin distinguir mayúsculas (el teclado del teléfono capitaliza «Ia»).'
        - 'Paso 8: todo aviso de historial se guarda primero en disco (archivo 600 nombrado por su sha256, carpeta 700) y se procesa si hay lista; así una falla lo deja pendiente y se borra solo al procesarse bien.'
        - 'Paso 8: al descargar un aviso solo se traducen las conversaciones 1:1 (número o LID); cada mensaje pasa por el mismo handler y lista blanca que los mensajes en vivo.'
        - 'Paso 9: una descarga de adjunto que falla por otra causa que expiración queda como «fallido»; la expirada (403/404/410 o sin URL) como «faltante»; audios, videos y stickers se describen pero no se descargan.'
        - 'Paso 9: el log de descarte por reintentos agotados lleva solo el teléfono enmascarado y el id (no el error, que podría traer contenido).'
        - 'Paso 11 / WAW-C06: una sesión sin vincular al arrancar también sale con 3 (reintentar no sirve); TemporaryBan, ClientOutdated y otros salen con 1, porque la receta solo nombra revocación y otra instancia como terminales.'
        - 'Paso 12: lo «escrito por este dispositivo» se reconoce porque el remitente propio tiene el mismo número de dispositivo que la sesión.'
        - 'Paso 14: la ejecución corre aparte del orden de la cola del chat propio, para que una acción larga no detenga la consola; el avance cada 15 min se manda mientras dura.'
        - "Paso 14: la propuesta se escribe primero (para tener el id del mensaje) y luego se guarda; si el guardado falla, el \U0001F44D sobre ese mensaje no hace nada."
        - 'WAW-A06 / WAW-A07: las tareas en segundo plano viven en la tabla «tareas» de la base del proyecto; quién las crea queda fuera de la receta (lo hacen las herramientas del agente). El vigía las revisa al arrancar y cada 1 min (intervalo no dado).'
        - 'WAW-A07 con cola en memoria: tras un reinicio la cola está vacía, así que una tarea sin cerrar se vuelve a encolar una vez; si sus archivos ya habían salido, llegan otra vez (al menos una vez).'
        - "Paso 15: el pie de cada documento lleva la marca \U0001F7E2 (todo mensaje del agente en el chat propio la lleva); sin pie se usa el nombre."
        - 'Paso 15: una ruta con «..» se rechaza aunque se resuelva dentro de una carpeta válida; los enlaces simbólicos no son «archivo regular» (Lstat).'
        - 'Paso 4: la prueba guardiana recorre el código de producción (sin _test.go, porque los fakes deben declarar SendMessage/Upload) y compara identificadores, no comentarios ni textos; «Upload» es exacto y solo SetGroup*/JoinGroup* son prefijos.'
        - 'Paso 4: «sus llamadas exactas» del emisor se fija de dos formas: 3 usos de SendMessage y 2 de Upload (interfaz mínima más llamadas) y 2/1 llamadas, con destino que sale de la sesión.'
        - 'Servicios externos (directorio de la lista blanca, agente, ejecutor de acciones y su vista previa): su contrato no lo fija la receta; se conectan como comandos externos con JSON por stdin/stdout configurados en config/vigia.json.'
        - 'Base del proyecto: Postgres en su propio esquema (search_path), con conexión por entorno; no hay pruebas contra una base real (prohibido conectarse), solo contra fakes de los puertos.'
        - 'Paso 2 / WAW-C13: el usuario de solo lectura se crea con deploy/sesion.sql (GRANT SELECT y default_transaction_read_only); la prueba usa un driver database/sql falso que imita ese comportamiento.'
        - 'Paso 11: la unidad usa After/Wants=network-online.target aunque en el gestor de usuario ese objetivo no siempre está disponible.'
      aprobada: true
