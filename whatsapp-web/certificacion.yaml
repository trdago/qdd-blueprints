      supuestos:
        - 'Paso 1 / WAW-C06: una sesión sin dispositivo vinculado al arrancar «vigia correr» se trata como error terminal (código 3), porque reiniciar cada 30 s no la vincula.'
        - 'Paso 3 / WAW-V03: «cuánto había» en el tiempo agotado es la suma de los Timeout de los códigos que entregó el canal de vinculación.'
        - 'Paso 14 / WAW-P05: el prefijo es «bot» (seguido de espacio, coma o dos puntos); «cierra» y «cerrar» cierran tanto solos como con prefijo («bot cierra»).'
        - 'Paso 13: un mensaje del chat propio cuenta como «escrito desde otro dispositivo» si el dispositivo del remitente no es el de esta sesión; las reacciones del chat propio entran por la misma cola y van al motor de aprobación.'
        - 'Paso 10: un adjunto sin tamaño declarado (0) se descarga; el texto del adjunto para normalizar y clasificar solo se extrae de archivos text/* (sin OCR ni lectura de PDF).'
        - 'Paso 10: se reintenta guardar ante cualquier error de la base, no solo «base ocupada».'
        - 'Paso 18 / WAW-T08: «por día» y «por hora» son ventanas móviles de 24 h y 1 h; cuentan solo los envíos que salieron (estado enviado); «lo mismo» es la misma persona con la misma huella del contenido de los archivos.'
        - 'Paso 18: el pie se arma con tipo, número, receptor, fecha y monto del documento que entrega quien pide el envío (sin IA); la advertencia de número nuevo se basa en que no haya envíos previos a ese teléfono.'
        - 'Paso 19 / WAW-K01: «dudoso» aplica a cualquier categoría con confianza bajo 0,70, no solo a las que proponen.'
        - 'Paso 19: el tope de 4000 caracteres se aplica al extracto del adjunto; el texto del mensaje y el nombre del adjunto van completos.'
        - 'Paso 19: una categoría fuera de las declaradas se trata como falla del clasificador (queda pendiente y gasta cupo).'
        - 'Paso 19 / WAW-K09: sin RUT propio configurado la contraparte es el primer RUT del texto.'
        - 'Paso 19: la contraparte y los RUT se guardan formateados 12.345.678-5; los montos se formatean con punto de miles y coma decimal (CLP sin decimales).'
        - 'Paso 7 / WAW-L02: varios contactos de la libreta con el mismo número cuentan como uno; el contacto agregado a mano requiere empresa y modo.'
        - 'Paso 6/20: el contrato de los servicios externos queda fuera del alcance; se implementó uno JSON sobre HTTP con URL y credencial en VIGIA_*_URL / VIGIA_*_TOKEN.'
        - 'Paso 13: qué responde el agente queda fuera del alcance; el comando trae un agente mínimo que solo acusa recibo, detrás del puerto Agente.'
        - 'Paso 11: el ancla de un faltante es el primer mensaje guardado posterior a él en su chat.'
