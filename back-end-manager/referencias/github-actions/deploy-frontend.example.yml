# Despliegue del frontend estático (frontend=s3_cloudfront). Bucket propio por ambiente: el sync con --delete
# nunca apunta a un bucket que comparte con otro uso, y su nombre sale de una variable propia (FRONTEND_BUCKET).
# Las variables VITE_* son públicas: quedan dentro del JavaScript que descarga cualquiera. Nunca un secreto.
name: Deploy frontend

on:
  push:
    branches: [main, qa]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    concurrency:
      group: deploy-frontend-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: frontend/.nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test --if-present
      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}    # pública
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Subir (assets con hash inmutables, index.html sin caché)
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          test -n "$FRONTEND_BUCKET" || { echo "::error::FRONTEND_BUCKET vacío"; exit 1; }
          test -f dist/index.html || { echo "::error::build sin index.html"; exit 1; }
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache"
      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths /index.html
