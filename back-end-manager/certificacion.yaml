      supuestos:
        - 'Paso 3 / concurrencia 0: se interpreto como sin concurrencia aprovisionada; la reservada es un parametro (10) y ReservedConcurrency x pool(1) no supera DbApiConnections.'
        - 'Paso 3 y 5 / timeout 10 s vs presupuesto 15 s: el timeout de la funcion es 10 s; el presupuesto efectivo es min(15 s, tiempo restante del contexto - 500 ms), asi el 504 propio sale siempre antes del corte.'
        - 'Paso 4 / CORS: una REST API con integracion proxy no agrega CORS a lo que devuelve la funcion; el preflight y los errores del gateway los pone el gateway (Cors y GatewayResponses del manifiesto) y el borde del adaptador (src/cors.js, fuera del router) estampa la misma politica comodin en las respuestas proxy. El router no escribe Access-Control-*.'
        - 'BEM-C10: el mock de preflight de SAM responde 200 en AWS real; la prueba acepta 200 o 204 y comprueba la politica declarada en el manifiesto.'
        - Varios ids de los pasos (E01, E02, H01, U01, S01, S02, S04, S05, V02, D01, D03, Q01, K01, K02, K04, O01, B01, M01, A01) no tienen texto de escenario; se interpretaron por su nombre y paso (la interpretacion esta en el nombre de cada prueba).
        - 'BEM-C06, C20, C19, P01, C21: el pipeline de Azure no se ejecuta; se prueban leyendo azure-pipelines.yml. El lock exclusivo del environment es una configuracion de Azure DevOps (no cabe en YAML) y se documenta en docs/DESPLIEGUE.md; el YAML usa lockBehavior: sequential.'
        - 'BEM-N01: el linter de promesas sueltas es propio (acorn) y equivale a no-floating-promises sin tipos.'
        - 'BEM-N03: las fechas de retiro de runtimes nodejs de scripts/check-runtime.mjs son las conocidas al escribir la receta.'
        - La imagen base de Lambda usa la etiqueta mayor nodejs:22; no se fija por digest porque no se puede resolver offline.
