      supuestos:
        - 'Paso 1: nombres de las variables de entorno: CORREO_SMTP_HOST, CORREO_SMTP_PUERTO, CORREO_SMTP_USUARIO, CORREO_SMTP_CONTRASENA, CORREO_REMITENTE_NOMBRE (nombre del producto), CORREO_REMITENTE, CORREO_REMITENTE_ALIAS, CORREO_PROVEEDOR, CORREO_TOPE_DIARIO, CORREO_MAX_REINTENTOS.'
        - 'Paso 1 / CORREO-C01: además de servidor y contraseña, también son obligatorios el usuario y el nombre del producto; el puerto por defecto es 587 y cualquier puerto distinto de 587/465 se rechaza al arrancar.'
        - 'Paso 1: la dirección del remitente, si no se configura, es la del usuario SMTP.'
        - 'Paso 1 / CORREO-C24: los 10 s de conexión y los 30 s por envío son campos de Config (fijos al cargar desde el entorno); la prueba baja TiempoEnvio a 300 ms solo para no esperar 30 s. Los 30 s cubren todo el envío, incluidos conexión y TLS.'
        - 'Paso 1 / CORREO-C03: un error de configuración (sin STARTTLS/TLS, sin AUTH, credenciales rechazadas 5xx en AUTH) deja el correo pendiente, reprogramado a 1 min, y no gasta intentos; un fallo de TLS que no es por tiempo se trata como configuración.'
        - 'Paso 1: la autenticación usa AUTH PLAIN o, si no está, AUTH LOGIN; el cliente SMTP es propio (net/textproto) para poder leer el id del servidor en la respuesta final.'
        - 'Paso 2 / CORREO-C02: el escáner recorre todos los archivos del árbol (más estricto que solo los versionados; la carpeta no es un repositorio git), omite .git, tmp, vendor y node_modules, e ignora valores que son referencias (${...}, <...>, {{...}}). Las reglas son heurísticas (clave con smtp/mail/correo/gmail/app + pass/contraseña/clave/secret con valor literal, y 16 letras minúsculas tipo contraseña de aplicación de Google). Se deja un workflow de ejemplo en .github/workflows/ci.yml.'
        - 'Paso 2 / CORREO-C20: «enviar correo sin autenticación» se interpretó como una ruta pública cuyo correo no pertenece a un flujo de cuenta. Registro y recuperación son públicas por naturaleza: se marcan FlujoCuenta, solo pueden usar las plantillas verificacion/recuperacion y solo escribir a la dirección del pedido (y quedan bajo el límite por IP). La prueba recorre un servicio HTTP de ejemplo (paquete servicio), porque la receta no define rutas propias.'
        - 'Paso 3: la estructura MIME es multipart/alternative { text/plain, multipart/related { text/html, imágenes } } cuando hay imágenes; texto y HTML van en quoted-printable; se agregan Content-Language y Auto-Submitted. Los separadores se derivan del contenido para que Armar sea pura y determinista.'
        - 'Paso 3 / CORREO-C04: el destinatario inválido se rechaza ya al encolar (error a la operación); un asunto con salto de línea que llega por los datos de la plantilla se detecta al armar y el correo queda fallido.'
        - 'Paso 3 / CORREO-C23: los 10 MB se miden sobre el mensaje armado completo (incluido el base64).'
        - 'Paso 4: plantillas disponibles: verificacion, recuperacion, invitacion y comprobante; la versión va en un comentario de cada archivo y el asunto en un bloque «asunto» del .txt. «en-US» se reduce a «en»; un idioma no admitido (p. ej. fr) usa es.'
        - 'Paso 4 / CORREO-C07: la imagen del QR la entrega quien encola (bytes PNG); el módulo no genera QR. El Content-ID del QR es qr@correo y la plantilla comprobante lo exige al encolar.'
        - 'Paso 5: la firma es Modulo.Encolar(tx, plantilla, destinatario, datos, clave); la IP del cliente viaja en Datos.IPOrigen. Clave vacía genera un id. La unicidad de la clave se aplica al confirmar (como ON CONFLICT DO NOTHING) y también dentro de la misma transacción.'
        - 'Paso 5: el trabajador «toma» los pendientes marcándolos enviando con un arriendo de 2×30 s, para que dos instancias no tomen el mismo; si una instancia muere, el correo vuelve a estar disponible al vencer el arriendo.'
        - 'Paso 6 / CORREO-C10: «hasta 5 veces» se interpretó como 5 reintentos después del primer intento (6 intentos en total); la espera tras el intento fallido n es min(1 min·2^(n-1), 1 h). Los errores de red (conexión rechazada, cortada o tiempo agotado) cuentan como temporales.'
        - 'Paso 6 / CORREO-C11: va a supresión un 5xx con código extendido 5.1.x, o 550/551/553 sin código extendido; otros 5xx (p. ej. 5.7.1 de política) fallan sin suprimir. Un 5xx en cualquier etapa salvo AUTH es fallo definitivo.'
        - 'Paso 7 / CORREO-C14: el día se cuenta en UTC con ventana fija (no los 24 h móviles de Google) y cada intento SMTP suma al tope diario; lo aplazado se reprograma a las 00:00 UTC siguientes y el aviso es un log WARN más el motivo en el registro.'
        - 'Paso 7 / CORREO-C15, C16: ventanas fijas por hora según la hora de creación del pedido; los límites se cuentan una sola vez por correo (no en cada reintento); lo que excede queda en estado «descartado» con el motivo en el registro, y la operación responde igual porque el límite se aplica en el trabajador.'
        - 'Paso 8 / CORREO-C17: las quejas se agregan con Supresion.Agregar(dirección, "queja") porque la receta no dice de dónde llegan; «verificar de nuevo» lo notifica el módulo que usa correo (p. ej. auth) con correo.DireccionVerificada. La receta no dice cómo verifica alguien suprimido si no recibe correos.'
        - 'Paso 9 / CORREO-C19: el registro guarda una fila por correo con su último estado; el destinatario se enmascara como a***@dominio; el motivo solo lleva códigos SMTP (nunca el texto del servidor); la clave de idempotencia no se registra; la purga de 90 días es Trabajador.PurgarRegistro, que alguien debe programar.'
        - 'Paso 9 / CORREO-C22: como el envío es asíncrono, el cliente ve solo un estado genérico (enviado, pendiente, no_entregado) en una ruta de ejemplo /cuenta/correo.'
        - 'Paso 10 / CORREO-C21: la prohibición de red es una Guardia instalada en TestMain como DialPorDefecto (falla sin resolver nombres y hace fallar la suite si hubo algún intento); cada prueba inyecta el Dial del servidor falso. El servidor falso normaliza CRLF a LF al capturar (textproto.ReadDotBytes).'
        - 'Paso 11 / CORREO-G01: la regla remitente = cuenta o alias declarado se aplica solo con proveedor gmail (CORREO_PROVEEDOR=gmail o host smtp.gmail.com); no se puede verificar desde el código que el alias esté verificado en «Enviar como» ni que la cuenta sea del producto.'
        - 'Paso 11 / CORREO-G02: el límite es 500 si la cuenta es @gmail.com/@googlemail.com y 2000 si es de otro dominio (se asume Google Workspace); «bajo el límite» se aplica en sentido estricto (un tope igual al límite también se rechaza).'
        - 'Criterio de éxito: la prueba manual (un correo de verificación real a una cuenta de prueba) no se automatiza ni se ejecutó; requiere credenciales reales configuradas por una persona.'
