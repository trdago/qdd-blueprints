      supuestos:
        - 'General: TypeScript corre con el type stripping nativo de Node, sin compilar ni descargar paquetes. No se hizo verificación de tipos porque tsc no está instalado (se deja tsconfig.json con erasableSyntaxOnly).'
        - 'Paso 1 / CORREO-C01: nombres de las variables: SMTP_HOST, SMTP_PORT (por defecto 587), SMTP_USER, SMTP_PASSWORD, SMTP_FROM, SMTP_REPLY_TO (opcional, por la variante smtp_propio) y CORREO_MAX_REINTENTOS (opcional, por defecto 3). Además del servidor y la contraseña, también se exigen el usuario y el remitente.'
        - 'Paso 1 / CORREO-C24: «la conexión se corta a los 10 s» se aplica a conexión TCP + TLS implícito + saludo 220, y «cada envío a los 30 s» a la sesión SMTP completa. Los valores 10 s y 30 s están fijos en la configuración; las pruebas pasan tiempos cortos directamente al transporte.'
        - 'Paso 1 / CORREO-C03: la regla 587/465 la aplica leerConfigSmtp; en las pruebas el transporte apunta al servidor falso en un puerto efímero con el modo (starttls o implícito) explícito. El certificado del servidor siempre se verifica; las pruebas confían en una CA generada en la corrida con node:crypto.'
        - 'CORREO-C03: «pendiente con error de configuración» no gasta un intento y se reprograma 1 h después. También cuentan como error de configuración (pendiente, nunca fallido) un certificado no confiable, un servidor sin AUTH y los 5xx en EHLO, STARTTLS o AUTH (p. ej. 535), porque el problema está de nuestro lado y no en el correo.'
        - 'Paso 2 / CORREO-C02: lo que cuenta como credencial literal lo definí yo: una clave tipo SMTP_PASS/SMTP_PASSWORD/APP_PASSWORD/contraseña de aplicación asignada a un texto entre comillas (o sin comillas en archivos que no son código), una contraseña de aplicación con formato de Google (cuatro grupos de cuatro letras entre comillas) o una URL smtp(s)://usuario:clave@. Se excluyen node_modules, .git y tmp. Supuse GitHub Actions como CI (.github/workflows/correo.yml).'
        - 'Paso 2 / CORREO-C20: la receta no trae servicio, así que escribí uno de ejemplo (src/servicio.ts, una tabla de rutas que se llama sin HTTP: salud, registro, verificar, recuperar, invitaciones y avisos del proveedor). Tomado al pie de la letra, «ninguna ruta envía correo sin autenticación» choca con el registro y la recuperación. Lo interpreté así: una ruta pública solo encola plantillas del sistema a la dirección de la cuenta en juego y dentro de los límites; enviar a un destinatario elegido (invitaciones) exige autenticación; ninguna ruta acepta asunto, contenido o plantilla libres y no hay rutas de prueba. Que no haya destinatarios escritos en el código se revisa con un escaneo de src/ y scripts/.'
        - 'Paso 3: estructura MIME: la raíz siempre es multipart/alternative (texto + HTML). Con imágenes, la parte HTML es un multipart/related con el HTML y las imágenes. Texto y HTML van en base64 UTF-8. El asunto y los nombres siempre van en RFC 2047 tipo B (también si son ASCII), en palabras de hasta 39 bytes. Solo se aceptan direcciones ASCII (sin IDN ni SMTPUTF8). Se agrega Auto-Submitted: auto-generated.'
        - 'Paso 3: para que la función sea pura, el Message-ID (derivado del id del correo, estable entre reintentos) y la fecha se pasan como datos. Los límites MIME se derivan de un hash del Message-ID.'
        - 'CORREO-C23: los 10 MB son 10*1024*1024 bytes del mensaje ya armado (después de base64), con un rechazo temprano si las imágenes solas ya lo superan.'
        - 'CORREO-C06: para que el texto y el HTML tengan «el mismo contenido», cada plantilla es una lista de párrafos de la que salen las dos partes. La prueba compara el HTML sin etiquetas con el texto.'
        - 'Paso 4: las plantillas son un módulo TS versionado (src/plantillas/v1.ts) con marcadores {{campo}}. Los textos y el conjunto de plantillas son míos: verificacion, recuperacion, invitacion, comprobante (con QR) y aviso. Los campos de enlace solo aceptan https. Del idioma se toma el prefijo (es-CL → es); cualquier otro idioma o ninguno → en.'
        - 'CORREO-C07: el QR lo genera el módulo que llama y llega como PNG en base64 dentro de los datos. La prueba usa bytes PNG falsos, no un QR real. No se incluyó logo.'
        - 'Paso 5: la base y su transacción se simulan en memoria (instantánea y vuelta atrás si la operación falla). encolar exige una transacción activa. Un segundo pedido con la misma clave no hace nada y devuelve {nuevo: false}. El trabajador marca las filas como «enviando» al tomarlas, para que dos trabajadores no las dupliquen. Al terminar un correo se borran sus datos (código, token). El trabajador corre por intervalo o lo despierta un callback (alEncolar) después de confirmar la transacción, sin que la operación lo espere.'
        - 'Paso 6 / CORREO-C10: «hasta 3 veces» se leyó como 3 reintentos después del primer intento (4 intentos en total). La espera antes del reintento n es min(60, 2^(n-1)) min, y la cantidad de reintentos se configura con CORREO_MAX_REINTENTOS. Conexión rechazada, conexión cerrada y tiempo agotado son errores temporales.'
        - 'CORREO-C11: solo va a supresión un 550, 551 o 553 en RCPT (con código extendido 5.1.x si viene). Otros 5xx (p. ej. 554 5.7.1) dejan el correo fallido sin reintentar y sin suprimir.'
        - 'Paso 7: las ventanas por hora son fijas (por hora de reloj) y se cuentan según la hora en que se encoló el correo. El día es el día calendario UTC. El contador diario cuenta intentos de envío, reintentos incluidos. Lo que excede el límite por destinatario o por IP queda «limitado» y no se reintenta. El orden de los chequeos es supresión → límites por hora → armado → tope diario. El almacenamiento compartido es una interfaz tipo Redis (incrementar con TTL); en las pruebas, una implementación en memoria compartida por dos instancias de trabajador.'
        - 'CORREO-C14: «se avisa» quedó como una línea de log de nivel aviso más una entrada «diferido» en el registro de envíos. No se definió ningún canal de alerta externo.'
        - 'Paso 8 / CORREO-C17: cómo verifica de nuevo su dirección una persona suprimida lo decide auth. Aquí el endpoint /verificar con el código llama a alVerificarDireccion, que la saca de la supresión. Las direcciones se comparan en minúsculas.'
        - 'Paso 9 / CORREO-C19: el registro guarda una entrada por cambio de estado con fecha, idCorreo, plantilla, estado, intentos, destinatario enmascarado (a***@dominio), idServidor (lo que sigue a «queued as» en el 250) y un motivo en código, sin el texto del servidor. La purga a 30 días es un método purgar(ahora); agendarla queda fuera.'
        - 'CORREO-C22: como el envío es asíncrono, la respuesta nunca depende de SMTP. Las rutas responden un mensaje genérico, y cualquier excepción interna se convierte en 500 «error_interno» sin detalle.'
        - 'Paso 10 / CORREO-C21: la guarda intercepta net.Socket.prototype.connect y solo deja pasar 127.0.0.1, ::1 y localhost. Cada archivo de prueba la importa. Para «la suite completa», la prueba C21 vuelve a correr toda la suite como proceso hijo con una bitácora de red. «El servidor falso recibió todos los mensajes» se verifica así: toda conexión SMTP de la suite fue a un servidor falso o a un puerto cerrado de la propia prueba, y los servidores falsos capturaron los mensajes.'
        - 'Paso 11 / CORREO-D01: la verificación lee TXT: un único SPF que incluye el mecanismo del proveedor (CORREO_SPF_INCLUDE), DKIM en <selector>._domainkey con p= no vacío (CORREO_DKIM_SELECTOR) y DMARC en _dmarc con p=none, quarantine o reject (CORREO_DOMINIO o el dominio de SMTP_FROM). Se ejecuta con scripts/verificar-dominio.ts y en el CI solo corre si está definida la variable CORREO_DOMINIO. No se verifica la firma DKIM de un mensaje real.'
        - 'CORREO-D02: la receta no dice el formato ni la firma de los avisos del proveedor. Supuse HMAC-SHA256 en hex sobre «marcaTiempo.cuerpo» con un secreto compartido inyectado al servicio (p. ej. desde una variable de entorno), cabeceras x-aviso-tiempo y x-aviso-firma, tolerancia de 5 min y cuerpo JSON {tipo: rebote|queja, permanente, destinatario}. Un rebote no permanente se acepta sin suprimir. Sin secreto configurado se rechaza todo. Un proveedor real (SES/SNS, Svix, etc.) necesitaría su propio adaptador.'
        - 'Variante smtp_propio: el remitente visible es «QDD Móvil» con la dirección de SMTP_FROM (dominio propio), y el Reply-To sale de SMTP_REPLY_TO si se define. El EHLO se presenta como «localhost» salvo que se configure otro nombre.'
        - 'Criterio de éxito (prueba manual): queda scripts/prueba-manual.ts, que envía un solo correo de verificación a CORREO_PRUEBA_DESTINATARIO con la configuración real. No se ejecutó: aquí no hay red ni servidor real.'
      aprobada: true
