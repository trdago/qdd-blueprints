      supuestos:
        - 'General: Go 1.24 con la biblioteca estándar; argon2id viene de golang.org/x/crypto v0.45.0, vendorizado en vendor/ para que las pruebas no necesiten red. Base de datos, bitácora, contadores de intentos y correo existen solo en memoria detrás de interfaces (Almacen, Bitacora, Contadores, Correo). La API es HTTP+JSON, y las rutas, los nombres de campos y los códigos de error son míos.'
        - 'Paso 1: los roles y el catálogo de permisos los inventé: base (rol base global), lector, editor, admin_org (de organización) y soporte (global, el único con comodín). Cada permiso lleva una marca ''administracion'' que decide si exige TOTP. La matriz tiene además los campos rol_base, rol_arranque (soporte) y un ámbito global u organizacion por rol, para que el código nunca escriba nombres de rol. Su ruta se configura en AUTH_MATRIZ; si la matriz falta o no es válida, NuevoServicio devuelve un error.'
        - 'Paso 2 / AUTH-C20: la lista pública justificada es matriz/rutas_publicas.json. También incluye las rutas que se autentican con una credencial que no es de sesión (endpoint interno, webhook y /ws con ticket), cada una con su justificación. La prueba recorre el registro de rutas del servicio (RegistrarRuta); el 404 genérico para todo lo demás no cuenta como ruta.'
        - 'Paso 3: elegí EdDSA (Ed25519) como único algoritmo. Agregué tres claims propios: pur (propósito), sid (sesión) y act (quién suplanta). Los tokens de recuperación, activación, verificación y confirmación y los tickets de tiempo real son opacos, no JWT: 128 bits aleatorios guardados como HMAC con el propósito incluido. Por eso, en AUTH-C14, un access token enviado para restablecer responde 400 simplemente porque no existe como token de recuperación; además se prueba que un JWT de otro propósito firmado con la llave de access da 401. La tolerancia de 60 s también se aplica a exp.'
        - 'Paso 3 / AUTH-C17: rotar deja la llave anterior verificando hasta ahora+15 min+60 s; retirarla la rechaza de inmediato, y ambas cosas se auditan con fecha. Las llaves llegan por configuración (AUTH_LLAVE_ACCESS, AUTH_LLAVES_ANTERIORES con formato kid:publica:hasta) y por los métodos RotarLlaveAccess y RetirarLlaveAccess. No hay KMS ni endpoint de rotación.'
        - 'Llaves por propósito: firma de access (Ed25519), HMAC para tokens de un solo uso, cifrado AES-256-GCM para los secretos TOTP, HMAC de seudónimos (logs, auditoría y claves de contadores), clave de servicio y secreto de webhook. Todas son obligatorias, de al menos 32 bytes y distintas entre sí. No creé la llave de ''capa de datos'' porque capa_datos=solo_backend y no se emiten tokens para esa capa.'
        - 'Paso 4 / AUTH-C11: ''no escucha peticiones'' se verifica comprobando que la función de arranque devuelve un error sin haber llamado a listen. Los secretos no tienen valor por defecto; solo AUTH_DIRECCION lo tiene (:8080).'
        - 'Paso 4 / AUTH-C18: el CI se representa con un escáner propio (cmd/escaner) y un workflow .github/workflows/ci.yml que lo corre. Las reglas son inventadas: archivos .env y .env.* (salvo .env.example), *.pem y *.key, BEGIN PRIVATE KEY, AKIA..., URLs con usuario:clave, asignaciones literales a password/secret/token/clave y AUTH_*=valor. Las pruebas no ejecutan GitHub Actions: corren el escáner sobre repositorios temporales y sobre este repositorio, incluido vendor/.'
        - 'AUTH-C15: la prueba de arquitectura busca, en el código Go que no es de prueba, literales de correo, RUT, UUID y nombres de rol de la matriz. Tiene una excepción justificada: el GUID fijo del protocolo WebSocket.'
        - 'Paso 5: tomé ''familia de sesiones de ese dispositivo'' como la cadena de refresh de un mismo login: una fila de sesión que guarda los hashes anteriores. Si un refresh se reúsa, se revoca esa sesión, no otras del mismo usuario, porque no hay id de instalación. El refresh se hashea con SHA-256 sin llave porque ya tiene 256 bits. Cada petición consulta la sesión, así que revocarla corta también el access token vigente.'
        - 'Paso 5: los permisos se guardan como una instantánea en la sesión. Se resuelven al abrirla, al renovar y al completar el TOTP; el token no lleva permisos. Suspender a alguien también revoca todas sus sesiones de inmediato, algo más estricto que AUTH-C05 (''al vencer el access token'').'
        - 'AUTH-S03: tomé ''usuario a su cargo'' como un miembro de la organización del administrador; para cualquier otro usuario la respuesta es 404.'
        - 'Paso 6: sin red no pude usar la lista oficial de las 1.000 contraseñas más comunes. Armé una propia de unas 95 contraseñas comunes de 10 o más caracteres (internal/auth/comunes.txt); las de menos de 10 ya se rechazan por largo. ''Contiene el identificador'' revisa la parte local del correo (si tiene 3 o más caracteres), el correo completo, el RUT y su cuerpo, sin distinguir mayúsculas. El largo se mide en runas Unicode.'
        - 'Paso 6: hay contadores de intentos por cuenta (seudónimo del identificador normalizado, exista o no la cuenta) y por IP. Un login correcto reinicia solo el contador de la cuenta, y los fallos se olvidan tras 24 h sin fallos nuevos. Mientras dura la espera, los intentos no suman fallos ni verifican la contraseña. En recuperación, cada solicitud cuenta contra el mismo umbral, no solo las fallidas. Los códigos y el TOTP llevan un contador por usuario.'
        - 'AUTH-P05: ''sobreviven a reinicios'' se modela así: el almacenamiento de contadores en memoria lo comparten dos instancias y luego una tercera instancia nueva. Todas usan la misma configuración, porque la llave de seudónimos tiene que ser común. En producción, ese almacenamiento sería Redis o una tabla.'
        - 'AUTH-P01: comparo la mediana de 4 mediciones por caso y uso IPs distintas para no activar el límite de intentos. El usuario inexistente o sin contraseña calcula un hash ficticio con los mismos parámetros.'
        - Agregué el estado 'invitado', previo a la activación; la receta solo nombra activo, suspendido y dado de baja. Si la contraseña actual es incorrecta al cambiarla, la respuesta es 400.
        - '''Debe cambiar la contraseña'': el guardián lo hace cumplir (esa sesión solo puede cambiar la contraseña o cerrar sesiones), pero ningún flujo lo activa, porque los administradores no fijan contraseñas y no hay endpoint para forzarlo.'
        - 'Paso 6 / AUTH-P10: interpreté ''nada se envía al nuevo mientras no esté verificado'' así: al valor nuevo solo llega su propio enlace de verificación; invitación, recuperación y avisos van al valor vigente. El correo nuevo queda pendiente y no sirve para entrar hasta que se verifica. El administrador cambia el correo con PATCH /api/orgs/{org}/usuarios/{id}, y eso también exige autenticación reciente. Si se invita al correo pendiente de alguien, se trata como una invitación a esa cuenta.'
        - 'Teléfono: el cambio sigue el mismo flujo que el correo, con el token enviado por el canal de mensajes en memoria porque no hay SMS. Ningún escenario lo prueba.'
        - 'RUT: cambiar el RUT reemplaza el valor y lo deja sin verificar (no queda pendiente). Solo lo verifica un administrador con identidad.verificar, indicando la fuente, porque un RUT no puede recibir un token de un solo uso.'
        - 'Paso 7: ''forma de RUT'' es dígitos y puntos, guion opcional y DV (dígito o K). Si el cuerpo tiene ceros iniciales se aceptan y se quitan, y un cuerpo que no queda en 7 u 8 dígitos responde 400. Un correo malformado también da 400 en el login. La solicitud de recuperación responde el mismo 202 aunque el identificador sea inválido.'
        - 'Paso 8: si se invita un correo que ya pertenece a una cuenta, se le agrega la membresía y se avisa a su correo vigente; la respuesta es 200 con el id, lo que revela que existe, pero solo a un administrador. Activar la cuenta verifica su correo. El enlace usa ''#token='' y su canje es por POST.'
        - 'Paso 9 / AUTH-W01: no hay navegador headless. Se verifica con análisis estático del cliente web embebido (no usa localStorage, sessionStorage, document.cookie ni indexedDB, y el token vive en una variable), con los atributos de la cookie y comprobando que el refresh no viaje en el cuerpo. El cliente web (web/app.js) es mínimo y no tiene pruebas de interfaz.'
        - 'Paso 9 / AUTH-W02: CSRF exige la cabecera propia X-CSRF-Proteccion: 1 y un Origin de la lista; si no hay Origin, exige Sec-Fetch-Site: same-origin, y sin ninguno de los dos responde 403. El logout se autentica con Bearer, no acepta cookie, y borra la cookie de refresh.'
        - 'Paso 10 / AUTH-B03: tomé como ''bundle'' los archivos de web/ y lo que se sirve en /, /static/app.js y /matriz.json. Se buscan patrones de credenciales de base o de tiempo real y los valores de los secretos de la configuración de prueba.'
        - 'Paso 11: las organizaciones y los ''recursos'' de ejemplo se crean directamente en el almacén; no hay endpoint de alta de organizaciones y las reglas de negocio quedan fuera de alcance. Una persona sin membresía en la organización recibe 404; un miembro sin el permiso, 403; una API key fuera de su organización o de sus permisos, 403 (como pide AUTH-C25).'
        - 'Paso 12: TOTP según RFC 6238 (SHA-1, 30 s, 6 dígitos, ±1 paso, sin reusar un paso). La inscripción tiene dos pasos. Los permisos de administración llegan a la sesión cuando se verifica el TOTP en POST /api/sesion/segundo-factor, no en el login. El rol con comodín también exige TOTP.'
        - 'Paso 13 / AUTH-S02: las acciones sensibles son cambiar el propio identificador, crear una API key, asignar roles con permisos de administración, borrar la cuenta y cambiar el correo de otra persona. Aceptan una de tres pruebas: un login con contraseña o TOTP de los últimos 5 min (renovar no cuenta), un código TOTP, o un código de confirmación de 6 dígitos enviado por correo y ligado con HMAC a usuario, acción y parámetros canónicos. Los nombres de las acciones y de sus parámetros son míos.'
        - 'Paso 14 / AUTH-I04 / AUTH-I05: el beneficio es una regla de negocio inyectada (beneficio → lista de RUT con derecho) y exige que el RUT esté verificado. El perfil editable es solo nombre, preferencias y avatar; cualquier otro campo responde 400 y no cambia nada.'
        - 'Paso 15 / AUTH-C12: las API keys tienen el formato qak_<uuid>.<secreto de 256 bits> y viajan en ''Authorization: ApiKey ...''. Se guarda el SHA-256 del secreto. La vigencia la elige quien la crea, entre 1 y 365 días. Sus permisos deben estar entre los del creador en esa organización y nunca incluyen apikeys.*. Una key solo actúa en rutas de su organización, y cada uso se audita.'
        - 'Paso 15 / AUTH-C23: la credencial de servicio va en la cabecera X-Clave-Servicio. El webhook va firmado con HMAC-SHA256 en la forma ''t=..,v1=..'', con 5 min de tolerancia; el formato es inventado.'
        - 'Paso 15 / AUTH-C24: escribí un WebSocket mínimo con la biblioteca estándar (solo handshake y marcos del servidor). Supuse que el ticket de un solo uso de 30 s puede ir en la URL (?ticket=), a diferencia de los tokens; los clientes que no son navegador también pueden usar Authorization: Bearer. El permiso se vuelve a revisar en cada entrega. No implementé el canal público de ''hubo un cambio''.'
        - 'Paso 16 / AUTH-C26 / AUTH-C28: un preflight desde un origen no listado responde 403 sin cabeceras CORS, y una configuración con ''*'' o ''null'' no arranca. La IP del cliente es el salto más a la derecha de X-Forwarded-For que no sea un proxy de confianza; sin proxy de confianza se usa la IP de la conexión (RemoteAddr).'
        - 'Paso 17 / AUTH-L01: ''desde web y app'' es el mismo endpoint DELETE /api/cuenta; la cabecera X-Cliente solo sirve para registrar el canal en la auditoría. Anonimizar significa borrar los campos personales. La baja también revoca las sesiones, las API keys creadas por la persona, sus membresías y sus tokens de un solo uso.'
        - 'Paso 18 / AUTH-L03: el índice único de correo y RUT excluye las cuentas dadas de baja. La cuenta nueva se crea por invitación, porque no hay registro abierto (alta_usuarios=invitacion).'
        - 'Paso 19 / AUTH-C30: la bitácora en memoria es de solo agregar, con una cadena de hashes, y entrega copias. Modificar y Borrar existen para representar al rol del backend y siempre devuelven ErrAuditoriaInmutable. El esquema SQL de referencia (db/schema.sql) solo otorga INSERT y SELECT, pero no hay base real.'
        - 'Paso 19: tomé ''misma transacción'' así: si registrar falla, la petición aborta con un 500 genérico. La bitácora rechaza los campos con nombres de secreto, los valores con ''@'' y los actores que no sean UUID. Los eventos sin persona identificada se atribuyen a un id de proceso generado al arrancar. Los datos personales se seudonimizan con HMAC.'
        - 'AUTH-C31: la suplantación es una sesión aparte de 30 min, sin refresh, de solo lectura por defecto y sin acciones sensibles. Usa el claim act con el id del soporte; la auditoría registra al soporte como actor y a la persona como sujeto.'
        - 'AUTH-C21: GenerarRestriccionRoles deriva la restricción de la matriz. db/schema.sql lo escribí a mano con ese mismo resultado (no hay un generador del archivo), y la prueba los compara. El almacén en memoria rechaza los roles que no están en la matriz.'
        - 'AUTH-C33: el diagnóstico está en /debug/estado y exige sistema.diagnostico; pprof no se registra. Los errores de la base y los pánicos se escriben solo en el log del servidor; el cliente recibe {error: error_interno}.'
        - 'Pruebas: además de las 59 de escenarios hay 2 propias: el rehash de un hash débil y el arranque completo que escucha. Usan un reloj falso para los vencimientos.'
