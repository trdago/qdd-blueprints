      lenguaje: TypeScript sobre Node 26 (type stripping nativo, node:test y node:crypto; sin dependencias externas)
      comando: node --test --test-concurrency=1 'test/**/*.test.ts'
      resultado: pruebas ✅ · escenarios con prueba 65/65
      supuestos:
        - 'General: todos los servicios externos van en memoria detrás de interfaces: base de datos (lee GRANT, CHECK, UNIQUE y políticas por fila desde bd/esquema.sql), almacenamiento compartido de contadores (como un Redis), correo, WhatsApp, JWKS de Google, capa de datos tipo PostgREST y tiempo real. HTTP se modela como petición/respuesta en proceso; src/principal.ts lo adapta a node:http.'
        - 'General: la numeración de escenarios tiene huecos (no hay P06, C08, C09, C27, B03, L03, I02, I03, R01 a R03, S04). Supuse que no faltan escenarios y que los 65 listados son todos.'
        - 'Paso 1: los roles de la matriz llevan tipo persona o sistema; la restricción de la base sale solo de los roles de persona. Los roles especiales (base, dispositivo, servicio, webhook) se nombran en la matriz para que el código nunca compare nombres de rol.'
        - 'Paso 1: el primer administrador, creado con el arranque de un solo uso, recibe el rol con comodín (soporte del producto). La receta no aclara si es admin o soporte.'
        - 'Paso 3: el algoritmo fijado es HS256, con un llavero por propósito (access, capa de datos, un solo uso). La receta no elige entre simétrico y asimétrico.'
        - 'Paso 3 / AUTH-C14: los tokens de un solo uso (recuperación, activación, verificación, vinculación, prueba de fusión) son JWT firmados con la llave de un solo uso, con un jti aleatorio de 128 bits y guardados hasheados. Así cumplen a la vez «aleatorio de 128 bits» y «cada token declara su propósito».'
        - 'Paso 3 / AUTH-C17: llave retirada significa un kid marcado como retirado en el llavero (o un kid desconocido). La rotación deja la anterior solo para verificar. No modelé cómo se guarda la llave nueva en un gestor de secretos.'
        - 'Paso 4 / AUTH-C11: elegí qué secretos son obligatorios (access, capa de datos, un solo uso, cifrado, clave de servicio, secreto del webhook, clave de la app), con mínimo 32 caracteres y todos distintos. La receta no los enumera ni fija un largo.'
        - 'Paso 4 / AUTH-C18: el escáner es propio (scripts/escanear-secretos.ts) y el CI es GitHub Actions. Ignora tmp/, .git/ y node_modules/. Las contraseñas de prueba están marcadas en su línea con escaner:permitir para que el CI no las tome como credenciales.'
        - 'Paso 5 / AUTH-C03: familia de sesiones del dispositivo = la cadena de rotación de esa sesión más las sesiones con el mismo id de instalación que declaró el cliente.'
        - 'Paso 5: los permisos resueltos se guardan como instantánea en la fila de sesión (al abrirla y en cada renovación). Cada petición verifica que la sesión no esté revocada, y por eso revocar corta el acceso al instante.'
        - 'Paso 5 / AUTH-C05: suspender no revoca las sesiones de inmediato, siguiendo «a más tardar al vencer el access token»: el access vigente sirve hasta 5 min, la renovación falla y el login responde el error genérico.'
        - 'Paso 6: los intentos durante un bloqueo no evalúan la contraseña ni suman fallos. Un login correcto reinicia los contadores de cuenta y de IP. Cada solicitud de recuperación cuenta como intento, porque no tiene «éxito». Los contadores se retienen 24 h y las claves usan seudónimos HMAC, no el correo.'
        - 'Paso 6: no hay red para bajar las 1.000 contraseñas más comunes. Incluí una lista abreviada (datos/contrasenas-comunes.txt, con entradas de 10 o más caracteres) que debe reemplazarse.'
        - 'Paso 6: «contiene el identificador» = contiene el correo completo o su parte local (3 o más caracteres), sin distinguir mayúsculas. El largo de 10 a 64 se mide en puntos de código Unicode, sin normalizar.'
        - 'AUTH-P01: el tiempo se compara con la mediana de 9 pares de mediciones en orden alternado, para que la carga de la máquina no meta ruido. El hash ficticio usa los mismos parámetros argon2id (argon2 nativo de node:crypto, Node 24.7 o superior).'
        - 'AUTH-P04 / AUTH-P07: una contraseña rechazada por la política no consume el token de recuperación.'
        - 'AUTH-P09: además de contrasena y password se rechazan clave, hashContrasena y nuevaContrasena. Cualquier otro campo no editable (rol, estado, beneficios) también da 400.'
        - 'AUTH-P10: la receta pide no enviar nada al valor nuevo mientras no esté verificado y, a la vez, verificarlo con un token de un solo uso. Supuse que al correo nuevo solo va el enlace de verificación; recuperación e invitación siguen yendo al correo registrado (el anterior). El cambio hecho por un administrador exige autenticación reciente del administrador.'
        - 'Paso 8 / AUTH-F01-F02: un token de Google con email_verified=false se rechaza siempre: ni vincula ni crea cuenta. Si el correo viene verificado e iguala exactamente al de una cuenta existente, responde 409 con un token de vinculación de un solo uso, que el dueño confirma autenticado y con autenticación reciente. Si no iguala, se crea una cuenta nueva.'
        - 'Paso 9: el enlace de verificación de correo vale 24 h (la receta no lo dice). Se puede entrar sin correo verificado; solo se bloquean las acciones sensibles.'
        - 'AUTH-L04: el registro con un identificador reservado responde lo mismo que el registro con un correo existente (202 genérico) y no avisa a nadie, porque no hay dueño. La invitación responde 409 no_se_pudo_invitar, igual que con un correo ya registrado. Google con un correo reservado responde 401.'
        - 'Paso 10: la invitación crea al usuario en estado pendiente y sin contraseña; activarlo verifica su correo. Reenviar una invitación va siempre al correo registrado.'
        - 'Paso 11 / AUTH-W01-W02: el navegador se simula con localStorage, sessionStorage y un tarro de cookies que respeta httpOnly. La cabecera propia de CSRF es X-CSRF: 1. Se exige un Origin de la lista o, sin Origin, Sec-Fetch-Site=same-origin. La cookie es __Host-refresh. Solo la renovación acepta el refresh en cookie; el cierre de sesión usa Bearer y borra la cookie.'
        - 'Paso 12 / AUTH-MV1: Keychain/Keystore es una interfaz (AlmacenSeguro) simulada. La prueba inspecciona mapas que representan preferencias, SQLite local y archivos de la app.'
        - 'Paso 13: la clave de la app se exige para crear la sesión anónima (identifica al cliente). La sesión de dispositivo tiene en la matriz un rol con permisos mínimos (catálogo y vincular). Pasar a una cuenta exige el login con contraseña dentro de esa sesión, y la sesión anónima se revoca. Vive con la misma regla de 7 días sin uso.'
        - 'Paso 14 / AUTH-B01-B02: la capa de datos simulada solo acepta role=authenticated (nunca service_role, ni con la llave propia), con su emisor, audiencia y llave. El token dura 5 min (la receta dice «corto»).'
        - 'AUTH-B05: el bundle es la concatenación de src/cliente más la configuración PUBLICO_*. La clave de la app sí va en el bundle porque no es credencial (AUTH-V02). Construir con una llave service_role o una API key en PUBLICO_* falla.'
        - 'Paso 15 / AUTH-S02: con segundo_factor=nadie, la alternativa a la autenticación de los últimos 15 min es reautenticarse con la contraseña o un código de 6 dígitos enviado al correo verificado, ligado a identidad + acción (método y ruta) + parámetros canónicos (cabecera X-Confirmacion). La receta no dice ni el canal ni el flujo del código.'
        - 'Paso 15: acciones sensibles = cambiar correo, teléfono o RUT; crear API keys; asignar cualquier rol (no solo los de administración); borrar la cuenta; fusionar; vincular Google; suplantar; rotar o retirar llaves. Además exigen correo verificado (AUTH-A01). La suplantación nunca puede hacerlas.'
        - 'Paso 16 / AUTH-I04: a un RUT no se le puede enviar un token. Supuse que lo verifica una fuente de confianza a través de un endpoint interno con credencial de servicio. La tabla RUT → beneficio es una regla de negocio simulada.'
        - 'AUTH-I05: los campos no editables del perfil se rechazan con 400 y no cambia nada; no se ignoran en silencio.'
        - 'Paso 17 / AUTH-C25: aunque multi_organizacion=no, modelé una organización (AUTH_ORGANIZACION_ID) como alcance de las API keys y rutas /organizaciones/:org/... para probar el «fuera de su organización».'
        - 'Paso 17 / AUTH-C23: el formato del webhook lo elegí yo: HMAC-SHA256 en X-Firma con t=...,v1=... sobre «t.cuerpo crudo», con ventana de 5 min.'
        - 'AUTH-C10 / AUTH-C24: el WebSocket se simula. Acepta un ticket opaco de un solo uso y 30 s en la query (?ticket=) o la cabecera Authorization. Un access token en la URL se ignora. Supuse que el ticket sí puede ir en la URL, aunque la receta prohíbe tokens ahí, porque los navegadores no permiten cabeceras en el WebSocket.'
