      lenguaje: TypeScript (Deno 2, WebCrypto, sin dependencias externas)
      comando: deno test -A
      resultado: pruebas ✅ · escenarios con prueba 50/50
      supuestos:
        - 'General: los servicios externos se simulan en memoria detrás de interfaces: Cognito y su JWKS (llaves RSA generadas en las pruebas), la base con sus políticas por fila y permisos por columna (src/bd.ts, src/capa_datos.ts), el canal de tiempo real, Keychain/Keystore, el navegador (localStorage, sessionStorage, cookies), la mensajería y la API de administración de Cognito. bd/esquema.sql y .github/workflows/ci.yml son de referencia: no se ejecutan contra Postgres ni GitHub reales.'
        - 'General: la receta no fija rutas, nombres de cabeceras, variables de entorno, formatos ni códigos HTTP fuera de los escenarios; todos son inventados (p. ej. POST /auth/canje, POST /auth/renovar, X-Clave-Servicio, X-Clave-App, X-Firma, AUTH_LLAVE_ACCESS_JWK).'
        - 'Paso 1: matriz en JSON (matriz/roles.json) con roles inventados: usuario (rol base), invitado_dispositivo, editor, admin y soporte (único con comodín), más roles de tipo sistema para la credencial de servicio interno y el emisor de webhooks, para que también esas rutas exijan un permiso de la matriz. Permisos efectivos = rol + rol base; un rol desconocido no tiene ninguno (ni siquiera los del rol base).'
        - 'Paso 1 / AUTH-C21: la restricción de la base se compara contra la base en memoria y contra bd/esquema.sql; solo los roles de tipo persona entran en la restricción de usuarios.rol.'
        - 'Paso 2 / AUTH-C20: la lista pública justificada es matriz/lista_publica.json (justificación de al menos 20 caracteres); además del test, el servicio no arranca si el inventario falla. Las peticiones OPTIONS (preflight CORS) se responden antes del router.'
        - 'Paso 3: algoritmos elegidos: ES256 para access y tokens de un solo uso, HS256 para la capa de datos (estilo Supabase), RS256 fijado para Cognito. El propósito va en el claim ''pur''; el access lleva además ''sid'' (id de sesión). La tolerancia de 60 s se aplica a exp, nbf e iat. Al rotar, la llave saliente solo verifica durante la vida máxima del token + 60 s; retirarPorFiltracion la invalida de inmediato y registra la fecha (sin endpoint, es una operación de administración).'
        - 'Paso 3 / AUTH-C14: la receta pide tokens de un solo uso ''aleatorios de 128 bits'' y a la vez que el token de recuperación sea rechazado como Bearer (lo que sugiere un JWT). Supuse un JWT de propósito ''recuperacion'' firmado con la llave de un solo uso, cuyo jti son 128 bits aleatorios guardados hasheados, de un solo uso e invalidados al emitir otro. Restablecer con un token ajeno responde 400.'
        - 'Paso 3 / recuperación: con Cognito como proveedor, la receta no dice quién gestiona contraseñas; supuse que el proyecto emite el enlace y aplica el cambio con la API de administración de Cognito (AdminSetUserPassword simulada) y revoca todas las sesiones.'
        - 'Paso 4 / AUTH-C11: secretos obligatorios por variables de entorno (JWK EC P-256 para access y un solo uso; ≥256 bits en base64url para datos, reserva y webhook; claves de servicio y de app); el arranque también falla si dos propósitos comparten secreto. ''No escucha'' se verifica con una función serve inyectada que nunca se llama y ejecutando src/main.ts sin entorno (sale con código distinto de 0).'
        - 'Paso 4 / AUTH-C18: no hay CI real disponible; el CI se representa con ci/escanear_secretos.ts (escáner propio, sin gitleaks) que la prueba ejecuta como subproceso sobre un repositorio temporal. Reglas heurísticas: archivos .env (salvo .example), llaves PEM privadas, JWK privados, access keys AKIA/ASIA, asignaciones literales de 12+ caracteres a password/secret/clave/token/api_key y URLs con credenciales.'
        - 'AUTH-C15: la prueba de arquitectura es heurística y más estricta que la receta: cualquier literal de correo, RUT o UUID dentro de src/ falla, se compare o no con la identidad. El primer administrador se crea con arrancarPrimerAdministrador (token de arranque hasheado, un solo uso, auditado), invocado por un operador, no por una ruta.'
        - 'Paso 5 / AUTH-C03: ''familia de sesiones de ese dispositivo'' = todas las sesiones del mismo usuario con el mismo id de dispositivo que envía el cliente al canjear (si no lo envía, cada sesión es su propia familia).'
        - 'Paso 5: los permisos resueltos al abrir y en cada renovación se guardan como instantánea en la sesión del servidor (el token no los trae); cada petición consulta la sesión, por lo que una revocación corta de inmediato. Suspender no revoca sesiones: el access vigente vale hasta vencer (≤5 min) y la renovación falla. La sesión no tiene vencimiento absoluto, solo 7 días sin uso.'
        - 'AUTH-S03: con multi_organizacion=no, ''usuario a su cargo'' se interpretó como un usuario cuyos permisos efectivos el administrador cubre (no puede actuar sobre soporte). Se agregó el permiso sesiones.ver_usuarios para que el administrador vea esas sesiones.'
        - 'Paso 6: se supone que el access token de Cognito trae email, email_verified y custom:run (agregados por un trigger pre-token-generation; por defecto Cognito no los pone en el access token). El primer canje registra al usuario (correo verificado obligatorio); no se vincula por correo con una cuenta existente de otro sub (se rechaza). El RUN que viene de Cognito se guarda como no verificado. Con un RUN distinto en el cuerpo (AUTH-D03) se audita la diferencia con los valores enmascarados.'
        - 'Paso 7: cookie __Host-refresh (HttpOnly, Secure, SameSite=Strict). CSRF: Origin en la lista permitida (o, sin Origin, Sec-Fetch-Site same-origin) y la cabecera propia X-Requested-With: qdd. Solo la renovación acepta cookies. AUTH-W01 se prueba con un cliente web simulado y almacenamientos en memoria, no con un navegador real.'
        - 'Paso 8 / AUTH-MV1: no hay app real; se prueba un cliente móvil que recibe por inyección un AlmacenSeguro (Keychain/Keystore simulado) y almacenes inseguros (preferencias, base local, archivos) que luego se inspeccionan.'
        - 'Paso 9: cada POST /dispositivo/sesion crea un usuario anónimo nuevo (el id de instalación no es credencial y no reabre sesiones anteriores); su rol invitado_dispositivo no incluye el rol base. Pasa a una cuenta solo con POST /dispositivo/vincular más un access token de Cognito de esa cuenta; se revocan las sesiones del anónimo y se copian sus preferencias. Para V02 no se encontró en la receta qué entrega la clave de app sola: se responde 400 sin id de instalación y, con él, solo una sesión anónima sin permisos sobre datos.'
        - 'Paso 10: el token de datos es HS256 con iss ''<producto>:<ambiente>'', aud y role ''authenticated'', 5 min y propósito ''datos''; la capa rechaza service_role. Columnas que el cliente puede escribir directo: nombre, preferencias y avatar; RUT y teléfono solo por la API, para que no se salten la anulación de la verificación.'
        - 'Paso 11 / AUTH-S02: con segundo_factor=nadie solo queda la autenticación reciente (≤15 min), que se renueva con POST /auth/reautenticar y un access token de Cognito con auth_time de hace ≤5 min. El código de confirmación por mensaje se usa en el cambio de correo (se envía al correo nuevo) además de la autenticación reciente. Acciones sensibles implementadas: cambiar correo, cambiar teléfono, crear API keys, asignar cualquier rol, borrar la cuenta y fusionar.'
        - 'Paso 12: beneficio de ejemplo ''descuento'' según un padrón inyectado; la verificación del RUT la marca un endpoint administrativo con la fuente declarada (simula la integración con un registro oficial). AUTH-I05: los campos no permitidos se rechazan con 400 (no se ignoran).'
        - 'Paso 13: API key con formato qk_<16 hex>_<secreto>, enviada como Bearer. Una key válida en una ruta que no admite keys responde 403 auditado (no 401). El alcance de organización se comprueba con el parámetro :org de la ruta (una sola organización configurada). El webhook se verifica con HMAC-SHA256 en el formato ''t=..,v1=..'' con 5 min de tolerancia. El tiempo real usa ticket de un solo uso de 30 s por query (la opción cookie no se implementó); la apertura del WebSocket se simula con GET /ws que responde 200 con el id de conexión. Quién es dueño de un dato está fuera de alcance: solo se filtra por el permiso documentos.ver.'
        - 'Paso 14: IP = primer salto no confiable de X-Forwarded-For desde la derecha, solo si la conexión viene de un proxy de confianza. Límite inventado: 30 peticiones por minuto por IP en canje, recuperación y sesión de dispositivo.'
        - 'Paso 15: acciones de enlace ''ver'' y ''subir'' (solo ''subir'' escribe y es de un solo uso), vencimiento máximo de 7 días, el secreto va tras # y se canjea con POST /enlaces/canjear. Responde 404 si no existe y 410 si se usó, venció o fue revocado. No se construyó la página del enlace: Referrer-Policy no-referrer y X-Robots-Tag noindex van en la respuesta del canje. El actor de auditoría de un enlace es el id del enlace.'
        - 'Paso 16 / AUTH-L01: la baja anonimiza nombre, correo, RUT, teléfono, avatar, preferencias y beneficios, revoca sesiones y API keys y desvincula las identidades de Cognito (no borra el usuario en Cognito). Es el mismo endpoint para web y app (DELETE /cuenta con autenticación reciente).'
        - 'Paso 17 / AUTH-L04: el hash es HMAC-SHA256 con una llave propia de reserva sobre el correo en minúsculas (y el RUT normalizado). Cualquier rechazo de alta o invitación responde lo mismo: 422 {"error":"registro_rechazado"}.'
        - 'Paso 18 / AUTH-L02: ''autenticada en esa operación'' = access token de Cognito de la cuenta absorbida con auth_time de hace ≤5 min, más autenticación reciente de la principal. Se guarda una instantánea de la cuenta absorbida; solo el soporte (cuentas.deshacer_fusion) puede deshacer.'
        - 'Paso 19: la auditoría en memoria es inmutable (registros congelados; actualizar y borrar lanzan error para cualquier rol, incluido backend), lo que representa el REVOKE más el trigger de bd/esquema.sql. Los datos personales se enmascaran (no se hashean) en la auditoría y en los logs; los secretos se omiten por nombre de campo y por patrón (JWT, API keys). Los eventos sin persona se atribuyen a un id de proceso configurado (AUTH_ID_PROCESO); el servicio interno y el webhook tienen ids propios configurados.'
        - 'AUTH-C31: la suplantación dura como máximo 30 min, es de solo lectura salvo escritura explícita y no se renueva; como su access token dura 5 min, en la práctica cada suplantación se limita a 5 min o a los minutos pedidos, lo que ocurra primero.'
        - 'Escenarios: la numeración tiene huecos (no existen AUTH-C08, C09, C27, D02, B03, L03, I01-I03, S04+); todos los escenarios citados en los pasos están definidos y viceversa.'
