      supuestos:
        - 'Paso 1: la receta no trae el catálogo de roles y permisos; inventé persona (rol base), lector, editor, admin_org, verificador y soporte (único con comodín) en matriz/matriz.json.'
        - 'Paso 1 / Paso 12: la receta no dice qué permisos son «de administración» (los que exigen TOTP); los marqué en la matriz con administracion: true (usuarios.*, roles.asignar, sesiones.revocar, auditoria.ver, api_keys.*, identidad.verificar, soporte.suplantar, sistema.*) y el comodín cuenta como administración.'
        - 'Paso 1 / Paso 11: «los roles se asignan por membresía», pero el rol de soporte del producto no pertenece a una organización; agregué a la matriz un ámbito por rol (propio / organizacion / plataforma). Los de plataforma (soporte, verificador) se guardan en el usuario y valen en cualquier organización solo a través de sus permisos.'
        - 'Paso 3: «algoritmo fijado» sin decir cuál; elegí EdDSA (Ed25519), kid = hash de la llave pública, propósito en el claim prp y sesión del servidor en sid. iss/aud se configuran.'
        - 'Paso 3 / AUTH-C14: los tokens de recuperación, activación y verificación son opacos (128 bits, guardados con HMAC y con su propósito), no JWT, por el invariante de tokens de un solo uso. El token de recuperación enviado como Bearer da 401 porque no es un JWT access; un access token en /auth/restablecer da 400.'
        - 'Paso 3 / Paso 5: además de verificar el JWT, cada petición mira la sesión (revocada o no) y el estado vivo del usuario. Es más estricto que «a más tardar al vencer el access token». Los permisos salen de lo que el servidor resolvió al abrir o renovar la sesión, nunca del token.'
        - 'Paso 5 / AUTH-C06: un cambio de rol se aplica al renovar. Hasta entonces el access token vigente (15 min o menos) mantiene lo resuelto antes.'
        - 'Paso 5 / AUTH-C03: la receta no define cómo se identifica el dispositivo ni la «familia». Supuse familia = sesiones del mismo usuario con el mismo id de dispositivo enviado en el login. Si no se envía, cada login es su propia familia.'
        - 'Paso 5 / AUTH-C05: suspender también revoca de inmediato las sesiones. La receta solo exige que falle la renovación, que igual revisa el estado.'
        - 'Paso 5: la inactividad de 30 días se cuenta desde el último uso, que se actualiza en cada renovación (no en cada petición).'
        - 'Paso 6: la receta pide rechazar las 1.000 contraseñas más comunes pero no trae la lista. auth/comunes.txt es una lista parcial curada (~150, solo importan las de 10 o más caracteres); hay que reemplazarla por una fuente pública.'
        - 'Paso 6: tomé «contiene el identificador» como el correo completo, su parte local (3 caracteres o más) o el cuerpo del RUT, sin distinguir mayúsculas.'
        - 'Paso 6 / AUTH-P02: no hay ventana de tiempo para «5 fallos seguidos». El contador de la cuenta se reinicia con el primer login correcto; el de IP no, para que intercalar una cuenta propia no lo reinicie. Un login con la contraseña correcta pero rechazado por estado (suspendido o de baja) no cuenta como fallo.'
        - 'Paso 6: en las solicitudes de recuperación no hay fallo ni éxito, así que cada solicitud cuenta como intento. Desde la sexta responde 429, igual exista o no la cuenta. Para códigos, TOTP y reautenticación cuentan los fallos por usuario.'
        - 'Paso 12 / AUTH-T01: la receta no dice si el TOTP va en el mismo login o después. El login entrega una sesión sin permisos de administración (segundo_factor_pendiente: true) y POST /auth/segundo-factor la eleva. Un administrador sin TOTP enrolado entra igual, sin permisos de administración, y debe enrolarlo.'
        - 'Paso 6 / AUTH-P10: «nada se envía al nuevo mientras no esté verificado» choca con «verificar el valor nuevo con un token de un solo uso», que hay que enviar al nuevo. La única excepción es el enlace de verificación, y solo cuando lo pide el dueño: si el cambio lo hace un administrador, no se envía nada al nuevo.'
        - 'Paso 6 / AUTH-P10: el correo nuevo queda pendiente y el vigente verificado se sigue usando para login, recuperación, invitaciones y reenvíos. Invitar un correo que está pendiente en otra cuenta responde 409. Cambiar el correo de otro (como administrador) lo traté como acción sensible.'
        - 'Paso 6: si el correo o RUT nuevo ya pertenece a otra cuenta, la respuesta es la misma (202) y no se hace nada, para no revelar cuentas. La receta no lo dice.'
        - 'Paso 14 / AUTH-I04: la receta no dice cómo se verifica un RUT (correo y teléfono tienen enlace). Supuse un rol de plataforma «verificador» (permiso identidad.verificar, con TOTP) que marca como verificado el RUT vigente. El padrón RUT → beneficio es configuración del servidor.'
        - 'Paso 13 / AUTH-S02: tomé «autenticación reciente» como login, reautenticación con contraseña (POST /auth/reautenticar) o TOTP en los últimos 5 min. La alternativa es un código de 6 dígitos por correo (10 min, 5 intentos) en la cabecera X-Confirmacion, ligado a usuario + acción + parámetros (JSON canónico). Las acciones sensibles se rechazan siempre en una suplantación.'
        - 'Paso 15 / AUTH-C12: inventé el formato de la API key («Authorization: ApiKey ak_<prefijo>_<secreto>», hash SHA-256). Una key solo actúa en su organización y con sus permisos; las rutas sin organización le dan 403. No puede pedir api_keys.crear ni recibir permisos que su creador no tiene. Al dar de baja una cuenta se revocan las keys que esa persona creó.'
        - 'AUTH-C25 frente a AUTH-M01: una API key que pide otra organización recibe 403 (lo pide C25), mientras una persona recibe 404 (lo pide M01). Mantengo las dos conductas.'
        - 'Paso 15 / AUTH-C23: inventé la cabecera de credencial de servicio (X-Credencial-Servicio, comparada en tiempo constante) y el formato de firma de webhooks (X-Firma: t=<unix>,v1=<HMAC-SHA256 de ''t.cuerpo''>, con ventana de 5 min).'
        - 'Paso 15 / AUTH-C10 / AUTH-C24: el ticket de WebSocket va en ?ticket= porque los navegadores no permiten cabeceras en WebSocket. Lo considero compatible con «tokens nunca en la URL» porque es de un solo uso y dura 30 s. El handshake RFC 6455 es mínimo (solo servidor → cliente) y la prueba usa net.Pipe en memoria. No implementé el canal público que solo avisa cambios porque ningún escenario lo pide.'
        - 'Paso 16 / AUTH-C28: X-Forwarded-For se recorre de derecha a izquierda saltando los proxies de confianza; la primera IP no confiable es el cliente. La receta no fija el algoritmo.'
        - 'Paso 16 / AUTH-C26: un preflight desde un origen fuera de la lista recibe 403 sin cabeceras CORS. Una petición simple de ese origen se atiende sin Access-Control-Allow-Origin (la bloquea el navegador).'
        - 'Paso 17 / AUTH-L01: con clientes=web, «desde la web y la app» es el mismo endpoint DELETE /cuenta. La prueba lo llama como web (Origin y cabecera propia) y como app (Bearer sin Origin). La baja es acción sensible. Anonimizar borra correo, RUT, teléfono, nombre, preferencias, avatar, hash y TOTP; deja el id, el estado baja y la fecha de creación, y quita las membresías.'
        - 'Paso 18 / AUTH-L03: como alta_usuarios=invitacion no hay registro abierto, así que el escenario se prueba con una invitación.'
        - 'Paso 8 / AUTH-I01: el invitado queda en un estado extra «invitado», que la receta no lista (solo activo, suspendido y baja), hasta que activa su cuenta. La activación marca el correo como verificado.'
        - 'Paso 19 / AUTH-P11 / AUTH-C29: en la auditoría «enmascarado» = primer carácter + «***». Los logs solo llevan ids y tipos de evento. Los eventos anónimos se atribuyen a procesos con UUID propio fijado en el código; esos ids no dan privilegios.'
        - 'Paso 19 / AUTH-C30: no hay PostgreSQL. La inmutabilidad se prueba así: la interfaz Bitacora solo agrega y lee; ActualizarComo y BorrarComo simulan el trigger y siempre fallan; y esquema/auditoria.sql (REVOKE más trigger) se revisa como texto, sin ejecutarse.'
        - 'AUTH-C21: la «restricción de roles de la base» es esquema/roles.sql, generado desde la matriz (CHECK rol IN …). La prueba exige que sea igual al texto que genera la matriz, y el almacén en memoria aplica la misma restricción.'
        - 'AUTH-C31: la receta no fija duraciones de la suplantación. Supuse solo lectura por defecto, 15 min por defecto y 60 como máximo, con motivo obligatorio, sin refresh ni permisos de administración.'
        - 'Paso 4 / AUTH-C11: lista de secretos obligatorios: AUTH_LLAVE_ACCESS, AUTH_LLAVE_UN_SOLO_USO, AUTH_LLAVE_CIFRADO, AUTH_CREDENCIAL_SERVICIO, AUTH_SECRETO_WEBHOOK, AUTH_DB_URL, más emisor, audiencia, orígenes, URL de la app y remitente. Tampoco arranca si dos propósitos comparten secreto. Con capa_datos=solo_backend no hay llave de capa de datos porque no se emiten tokens para la base.'
        - 'Paso 4 / AUTH-C18: la receta no define «credencial literal». El escáner (cmd/escaner, que corre el CI en .github/workflows/ci.yml) busca archivos .env* (se permite .env.example), .pem/.key/.p12/.pfx, cabeceras PRIVATE KEY, URLs con usuario:clave, llaves AKIA y asignaciones literales de 8 caracteres o más a password, secret, api_key y similares. Las muestras de la prueba se crean en ./tmp.'
        - 'AUTH-C15: la «prueba de arquitectura» lee el AST de todo el código que no es de prueba. Busca correos, RUT, UUID o nombres de rol comparados (==, !=, switch, EqualFold, Contains, HasPrefix, claves de mapas) y cualquier correo literal.'
        - 'AUTH-W01: no hay navegador real. Se prueba que el refresh viaja solo en cookie httpOnly, Secure y SameSite=Strict con el path de renovación, que ningún cuerpo lo expone, y que web/cliente.js guarda el access token en una variable y no usa localStorage, sessionStorage, indexedDB ni document.cookie.'
        - 'AUTH-W02: el CSRF exige la cabecera propia X-Solicitud: 1 y un Origin de la lista (o Sec-Fetch-Site: same-origin si no hay Origin).'
        - 'AUTH-B03: el «bundle de los clientes» es la carpeta web/. Se busca en ella esquemas de conexión y nombres de variables de credenciales, y se verifica que las rutas públicas no entreguen ningún secreto configurado.'
        - 'AUTH-P01: con argon2id real (m=64 MiB, t=3, p=1) se compara la mediana de 3 intentos de cada tipo, desde IPs distintas para no gatillar el bloqueo por IP.'
        - 'AUTH-C33: «una ruta que falla en la base» se simula con un error del almacén que trae SQL, y además con un pánico; ambos responden 500 «error interno».'
        - 'AUTH-C17: rotar y retirar llaves se hace por endpoint con el permiso sistema.llaves. No se puede retirar la llave activa, y la retirada queda auditada con su fecha.'
        - 'Invariante del primer administrador (sin escenario): ArranqueInicial es de un solo uso y queda auditado, pero la bandera vive en memoria; en producción tiene que persistir.'
